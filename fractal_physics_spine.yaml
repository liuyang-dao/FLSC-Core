# ============================================================
# 五层同源映射（物理域实例化）
# ============================================================
five_layer_map:

  U_Unit_层:
    description: "分形自我展开的最小稳定模式（Fracton）"
    physics_entities:
      - "Fracton(s) 分形元（尺度依赖、非局域、涌现）"
      - "经典粒子（宏观稳态近似）"
      - "量子激发（微观波动近似）"
      - "时空泡沫（普朗克尺度几何涨落）"
    dmp_phase: "φ₁ 凝结（Condensation）"
    note: "U 层无固定尺度、无局域实体属性，仅为尺度依赖的稳态结构。"

  C_Connect_层:
    description: "不同尺度分形结构的映射关系（尺度变换 Scaling）"
    physics_entities:
      - "电磁力 = U(1) 相位空间尺度变换"
      - "弱力 = SU(2) 手性空间尺度变换"
      - "强力 = SU(3) 色空间尺度变换"
      - "引力 = 广义协变（坐标变换尺度不变性）"
    dmp_phase: "φ₂ 解离（Dissolution）"
    note: "所有『力』均为分形内部空间的尺度变换，四力统一为同一动作的不同内部空间表现。"

  W_Weight_层:
    description: "描述分形展开密度的本征参数（分形维数 D）"
    physics_entities:
      - "精细结构常数 α≈1/137（电磁维数表征）"
      - "引力常数 G（时空分形本征维数）"
      - "普朗克常数 h（量子尺度维数）"
      - "光速 c（因果结构维数）"
    dmp_phase: "φ₂→φ₃ 过渡（Weighting）"
    note: "W 层目前为符号层（F-02/F-06）：D(α) 显式公式待补。"

  K_Constraint_层:
    description: "分形跨尺度保持结构同构的刚性规则（自相似约束）"
    physics_entities:
      - "规范对称（U(1)/SU(2)/SU(3)）"
      - "广义协变性"
      - "守恒定律（能量/动量/角动量/电荷）"
      - "观测者截断约束（F-08 待补）"
    dmp_phase: "约束贯穿 φ₁φ₂φ₃ 全相位"
    hardbonds:
      - id: "HB-PHYS-L3-NO-CLASSICAL-PRESET"
        rule: "禁止预设经典/量子为两类实在"
        level: "L3_hard"
      - id: "HB-PHYS-L3-NO-FORCE-AS-ENTITY"
        rule: "禁止把力当作独立实体"
        level: "L3_hard"
      - id: "HB-PHYS-L2-NO-CONSTANT-FIX"
        rule: "禁止把无量纲常数当作自由参数"
        level: "L2_medium"
      - id: "HB-PHYS-L2-OBSERVER-TRUNCATION"
        rule: "观测者截断作用必须显式建模（F-08 修复方向）"
        level: "L2_medium"

  S_Steady_层:
    description: "分形递归展开的稳定收敛边界（分形吸引子）"
    physics_entities:
      - "真空（最低吸引子）"
      - "粒子（中尺度吸引子）"
      - "黑洞（强场奇异吸引子）"
      - "宇宙（全域吸引子）"
    dmp_phase: "φ₃ 流动（Flow）"
    note: "S 层 = 不同层级的吸引子稳态，黑洞中心为分形奇异吸引子（无传统奇点）。"

# ============================================================
# 六条脊线 (Spine) · 分形物理学
# 总数 = 6，符合 SIT 公理 1 (|Spine| ≤ 7)
# ============================================================
spine:

  PHYS-01_fracton_unit:
    name: "分形元单元脊"
    description: "从连续物理现象中切出 Fracton 分形元的主干"
    U: "Fracton(s) 尺度依赖单元"
    C: "unit_scaling (单元跨尺度映射)"
    W: "fractal_dimension_D + scale_dependency"
    K: "HB-PHYS-L3-NO-CLASSICAL-PRESET"
    S: "任意物理实体可还原为分形元稳态近似"
    dmp_mapping: "φ₁ 凝结（Condensation）"
    fracture_types:
      - "尺度固化：误将某一尺度的 Fracton 形态当作固定实体"
      - "局域化谬误：把非局域 Fracton 当作点粒子"
    repair_operators:
      - "多尺度交叉验证（经典/量子/普朗克三态对照）"
      - "非局域性显式建模"
    human_exclusive: false

  PHYS-02_scaling_connection:
    name: "尺度变换连接脊"
    description: "将所有相互作用统一为分形内部空间尺度变换的主干"
    U: "four_forces (电磁/弱/强/引力)"
    C: "scaling_transformation (尺度变换链)"
    W: "coupling_strength + symmetry_group_priority"
    K: "HB-PHYS-L3-NO-FORCE-AS-ENTITY"
    S: "四力可还原为同一尺度变换动作的不同内部空间表现"
    dmp_mapping: "φ₂ 解离（Dissolution）"
    fracture_types:
      - "力实体化：把规范场当作独立实体而非尺度变换"
      - "引力孤立：未将广义协变纳入统一尺度变换框架"
    repair_operators:
      - "规范群谱系统一推导 U(1)×SU(2)×SU(3)×引力"
      - "Γ* 递归展开验证四力同构"

  PHYS-03_dimension_weight:
    name: "分形维数权重脊"
    description: "为物理常数赋予分形维数本征参数权重的主干"
    U: "α / G / h / c 四个无量纲常数"
    C: "dimension_derivation_chain (维数推导链)"
    W: "D_estimation_accuracy + residual_per_constant"
    K: "HB-PHYS-L2-NO-CONSTANT-FIX"
    S: "所有无量纲常数可表征为分形维数的稳态取值"
    dmp_mapping: "φ₂→φ₃ 过渡（Weighting）"
    fracture_types:
      - "常数自由化：把 α/G/h/c 当上帝给定参数"
      - "维数虚化：D 仅为符号无显式公式（F-02/F-06）"
    repair_operators:
      - "非交换几何 + 重整化群联合推导 D(α)"
      - "超高精度光谱测量校准"

  PHYS-04_selfsimilar_constraint:
    name: "自相似约束脊"
    description: "分形跨尺度同构刚性规则（对称/守恒）的主干"
    U: "gauge_symmetries (U(1)/SU(2)/SU(3)/广义协变)"
    C: "conservation_propagation (守恒律传导链)"
    W: "symmetry_rigidity + constraint_priority"
    K: "HB-PHYS-L2-OBSERVER-TRUNCATION（F-08 修复后）"
    S: "所有对称守恒律可还原为自相似约束的衍生表现"
    dmp_mapping: "约束贯穿全相位"
    fracture_types:
      - "对称性割裂：未解释对称性存在前提（§2.2 残余）"
      - "观测者缺位：测量截断作用未进五层（F-08）"
    repair_operators:
      - "自相似约束统一推导四力对称群"
      - "观测者截断显式建模（对接 COG-06 元认知脊）"

  PHYS-05_attractor_steady:
    name: "分形吸引子稳态脊"
    description: "驱动物理系统向分形吸引子稳态收敛的主干"
    U: "vacuum / particle / blackhole / universe"
    C: "attractor_basin_flow (吸引子盆流量)"
    W: "attractor_stability + information_density"
    K: "HB-PHYS-L3-NO-CLASSICAL-PRESET"
    S: "粒子/时空/宏观世界均为不同层级吸引子稳态"
    dmp_mapping: "φ₃ 流动（Flow）"
    fracture_types:
      - "奇点预设：黑洞中心假设传统奇点（应为分形奇异吸引子）"
      - "真空静态化：把真空当空无一物（应为最低吸引子）"
    repair_operators:
      - "黑洞熵 = 分形边界全息编码"
      - "EHT 黑洞阴影高精度观测验证"

  PHYS-06_recursive_unification:
    name: "递归统一脊（OJP 物理域展开）"
    description: "执行 Γ* 递归，将标准模型/相对论/热力学/宇宙学统一为主干"
    U: "Origin₁(物理) = 分形的自我展开"
    C: "recursive_expansion_chain (递归展开链)"
    W: "orc_depth + residual_per_scale"
    K: "ORC≤5 强制终止 + Origin₁ 不可替代"
    S: "所有物理定律可还原为 Origin₁ 的递归展开产物"
    dmp_mapping: "Γ* 递归生成（∂⁺ 全展开）"
    fracture_types:
      - "递归截断：声称已达终极统一理论（F-07）"
      - "Origin₁ 覆盖：后续 Jump 覆盖而非叠加（F-05）"
    repair_operators:
      - "ORC 计数器硬约束（当前 orc=1，max=5）"
      - "下次 Jump 生成 Origin₃ ≠ Origin₁"

# ============================================================
# 脊线独立性校验 (SIT 公理 3)
# ============================================================
independence_check:
  note: "任意两条脊线之间无直接因果上下游"
  verification:
    - "PHYS-01（分形元）不导致 PHYS-02（尺度变换），单元是前提，变换是后续"
    - "PHYS-03（维数权重）不导致 PHYS-04（自相似约束），权重是参数，约束是规则"
    - "PHYS-05（吸引子稳态）对所有脊线做反馈校准，但不改变其他脊线结构"
    - "PHYS-06（递归统一）监控全部脊线运作，但本身不是其他脊线的产物"
    - "PHYS-02（尺度变换）不导致 PHYS-01（分形元），变换是单元间链路，不是单元本身"
  result: "六条脊线两两独立 ✓（理论判定，待数学形式化实证）"


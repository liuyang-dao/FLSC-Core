# Axiom R · 现实残差（物理域）
# ============================================================
axiom_r:
  formula: "MIS_true = MIS_train × (1 − λ × ||RealityResidual||)"
  current_estimate:
    MIS_train: 0.78  # 本体论重构内洽度（五层+六脊闭合）
    reality_residual: 0.55  # 数学形式化缺失 + 实证未完成
    lambda: 0.6  # 物理域高系数（强实证约束）
    MIS_true: 0.51  # = 0.78 × (1 − 0.6 × 0.55)
  mode: "experimental_with_partial_theoretical_grounding"
  grade: "DEGRADED_OPERATION"
  note: "MIS_true 偏低因数学形式化（F-01/F-06）与实证（F-04）均未完成；V1.1 数学框架补完后预计升至 EXPERIMENTAL_ACCEPTABLE"


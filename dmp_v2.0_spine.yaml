  note: "MIS_train 提升因 V1.2→V2.0 递归自洽通过；λ 从 0.5 降至 0.4 因递归减少了现实残差；MIS_true 待更多生成周期实证。"

# ============================================================
# Ψ 操作协议（一步三态）
# ============================================================
operation_protocol:
  core_operation:
    id: Ψ
    name: 递归显形（Recursive Manifestation）
    definition: "Ψ(P) = Γ*(P) = [φ₁(P), φ₂(P), φ₃(P)]"
    nature: "合取非序列（simultaneous, not sequential）"

  phases:
    - id: φ₁
      name: 凝结（Condensation）
      input: "现象流 P(t)"
      operations:
        - "从连续中切出 X₀"
        - "执行 δ(X₀, ¬X₀)"
        - "悬置对立预设"
      output: "X₀（初始条件）"
      human_role: "Sense（独占）"
      ai_role: "不可介入"

    - id: φ₂
      name: 解离（Dissolution）
      input: "X₀ + Γ*(X₀) 的差异场"
      operations:
        - "执行 Γ*(X₀) = Γ(X₀, Γ*(X₀))"
        - "展开差异 Δ(X₀, Γ*(X₀))"
        - "大规模模式匹配 + Epoché"
      output: "差异场 Δ（生成的展开）"
      human_role: "Epoché + Jump（独占）"
      ai_role: "形态3 实例化 + embedding 检索"

    - id: φ₃
      name: 流动（Flow）
      input: "差异场 Δ"
      operations:
        - "稳态化 Δ → ONGOING"
        - "标记残余（reality_residual）"
        - "诚实披露已知缺口"
      output: "ONGOING 稳态（永不封闭）"
      human_role: "诚实裁决（独占）"
      ai_role: "RIS_true / MIS_true 量化追踪"

# ============================================================

# ============================================================
# 五条统一公理
# ============================================================
axioms:
  A1_结构提取公理:
    statement: "所有学习，本质上是智能体从环境中提取可复用的结构，并将其编码到自身的 C 层连接拓扑中"
    implication: "学习 ≠ 信息存储；无效学习 = 只存储信息未编码结构"
    spine_support: "K-01/K-02 基础前提"

  A2_残差驱动公理:
    statement: "学习的唯一驱动力，是智能体感受到的「当前结构与目标结构之间的残差」。无残差则无学习"
    implication: "残差过小→停滞；适中→最优；过大→崩溃"
    spine_support: "K-02 残差暴露动力脊"

  A3_压缩迁移守恒公理:
    statement: "学习的收敛速度与迁移能力成反比——快速压缩的结构迁移弱，慢速自生的结构迁移强"
    implication: "不存在既快速收敛又高迁移上限的学习方式，这是结构守恒"
    spine_support: "K-01 压缩-迁移守恒脊"

  A4_自主结构生成公理:
    statement: "真正的迁移能力，只能来自智能体自主生成 C 层结构；外部注入的结构只能用于局部应用"
    implication: "C 层自生→结构完整可迁移；C 层外包→结构拷贝迁移受限"
    spine_support: "K-02 残差暴露的必然结果"

  A5_学习层级嵌套公理:
    statement: "每个智能体的学习行为本身也是一层学习——系统学习如何学习（元学习），是更高阶的结构提取"
    implication: "L0~L3 四级嵌套，层级越高跨域适应与范式跃迁能力越强"
    spine_support: "K-03 层级嵌套演化脊"

# ============================================================
# 六阶段学习路径模型
# ============================================================
six_stage_model:
  stage_0_perception:
    name: "感知"
    operation: "智能体感知环境中的模式"
    layer: "U 层激活"
    carbon: "✅ 有限"
    silicon: "✅ 强"
    org: "✅"
    hybrid: "✅"

  stage_1_extraction:
    name: "结构提取"
    operation: "从感知中提取可复用的结构"
    layer: "C 层建立新连接"
    carbon: "✅ 强"
    silicon: "✅ 强（统计拟合）"
    org: "✅"
    hybrid: "✅"

  stage_2_compression:
    name: "压缩存储"
    operation: "将结构编码为内部状态"
    layer: "W 层权重调整"
    carbon: "中"
    silicon: "✅ 强（参数存储）"
    org: "✅"
    hybrid: "✅"

  stage_3_transfer:
    name: "迁移应用"
    operation: "将结构迁移到新情境"
    layer: "C 层跨域连接"
    carbon: "✅ 强"
    silicon: "⚠️ 弱（跨域差）"
    org: "✅ 可变"
    hybrid: "⚠️ 待实证"
    threshold_sis: "SIS ≥ 0.6 基础迁移；SIS ≥ 0.85 强迁移"

  stage_4_metacognition:
    name: "元认知"
    operation: "反思自身学习过程"
    layer: "S 层自指回路"
    carbon: "✅ 强"
    silicon: "❌ 极弱"
    org: "⚠️ 罕见"
    hybrid: "⚠️ 待实证"
    threshold: "持续迁移失效残差 + 残差可承受 → 触发"

  stage_5_reconstruction:
    name: "结构重构"
    operation: "废弃旧 C 层，生成新 C 层"
    layer: "C 层重建"
    carbon: "✅ 罕见"
    silicon: "❌ 无"
    org: "❌ 极罕见"
    hybrid: "⚠️ 待实证"
    threshold: "元认知确认旧 C 层无法覆盖新残差 → 触发"

# ============================================================
# 量化指标体系
# ============================================================
quantitative_metrics:
  SIS:
    full_name: "Structure Integrity Score 结构完整性得分"
    definition: "智能体 C 层自主生成结构的完备程度"
    range: "[0, 1]"
    meaning: "越高则迁移能力越强，学习越深入"
    formula_note: "SIS ∝ 残差暴露度（定性定量框架，精确系数待校准）"

  CR:
    full_name: "Compression Ratio 压缩度"
    definition: "学习目标的预压缩程度，即外部注入结构的占比"
    range: "[0, 1]"
    meaning: "越高则收敛越快，迁移越弱"
    typical_values:
      self_trained_llm: "0.2~0.3"
      distilled_llm: "0.7~0.8"
      exam_education: "0.75~0.9"
      project_based_learning: "0.2~0.4"
      mature_org: "0.3~0.5"

  TC:
    full_name: "Transfer Capability 迁移能力"
    definition: "智能体将已有结构应用于新领域的能力"
    range: "[0, 1]"
    meaning: "学习质量的核心终局指标"
    formula: "TC = SIS × (1 - α × CR)，α = 0.7（通用学习场景）"
    typical_values:
      self_trained_llm: "0.6~0.7"
      distilled_llm: "0.3~0.45"
      exam_education: "0.25~0.4"
      project_based_learning: "0.6~0.85"
      mature_org: "0.5~0.7"


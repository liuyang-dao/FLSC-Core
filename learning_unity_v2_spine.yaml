# ============================================================
# 五层同源映射（全智能体统一实例化）
# ============================================================
five_layer_map:

  U_Unit_层:
    description: "智能体的最小状态单元"
    universal_definition: "智能体的最小可观测/可训练单元"
    agent_instances:
      carbon_human: "神经元"
      silicon_ai: "参数（权重/偏置）"
      organization: "成员"
      hybrid: "人节点 + AI 节点"
    dmp_phase: "φ₁ 凝结（Condensation）"
    note: "U 层是学习系统的最小可调度单元，不同载体的单元形态不同但层级同构。"

  C_Connect_层:
    description: "单元间及单元与环境的连接拓扑"
    universal_definition: "信息流与因果链路的拓扑结构"
    agent_instances:
      carbon_human: "突触连接"
      silicon_ai: "注意力/权重连接"
      organization: "沟通链路"
      hybrid: "人机交互 + 协同决策链路"
    dmp_phase: "φ₂ 解离（Dissolution）"
    note: "C 层是学习的核心层——结构提取的本质就是 C 层拓扑改变。"

  W_Weight_层:
    description: "各连接的强度/重要性"
    universal_definition: "连接权重的数值度量"
    agent_instances:
      carbon_human: "突触权重"
      silicon_ai: "权重矩阵"
      organization: "影响力/决策权"
      hybrid: "人机权责分配 + 信任权重"
    dmp_phase: "φ₂→φ₃ 过渡（Weighting）"
    note: "W 层是压缩度的载体——外部注入的知识直接写入 W 层。"

  K_Constraint_层:
    description: "学习的硬边界"
    universal_definition: "系统不可突破的约束条件"
    agent_instances:
      carbon_human: "能量/死亡/时间"
      silicon_ai: "算力/数据/预算"
      organization: "资源/制度/使命"
      hybrid: "人机协同边界 + 伦理约束"
    dmp_phase: "约束贯穿 φ₁φ₂φ₃ 全相位"
    hardbonds:
      - id: "HB-LRN-K-AUTONOMY"
        rule: "C 层自主生成不可被外部注入完全替代"
        level: "L3_hard"
      - id: "HB-LRN-K-RESIDUAL"
        rule: "残差暴露度不得低于阈值（否则退化至阶段 3 中断）"
        level: "L2_soft"
      - id: "HB-LRN-K-METACOGNITION"
        rule: "阶段 4 元认知触发条件不可被跳过"
        level: "L2_soft"

  S_Steady_层:
    description: "学习的收敛目标"
    universal_definition: "学习系统达到的稳定态"
    agent_instances:
      carbon_human: "认知稳态"
      silicon_ai: "训练收敛"
      organization: "战略达成"
      hybrid: "人机协同稳态 + 价值对齐"
    dmp_phase: "φ₃ 稳态（Steady State）"
    note: "S 层是 K-03 层级嵌套演化脊的终极归宿——达到后可触发新一轮 OJP。"

# ============================================================
# 三条通用学习核心脊线
# ============================================================
spine:

  K-01_压缩迁移守恒脊:
    name: "压缩-迁移守恒脊"
    definition: "学习系统的知识压缩程度与迁移上限成反比，与收敛速度成正比"
    dimension: "速度-质量守恒"
    layers: ["C", "W", "S"]
    law: "压缩度↑ → 收敛快 → 迁移弱；压缩度↓ → 收敛慢 → 迁移强"
    scvp: "CLOSED"
    supports_axiom: "公理三：压缩-迁移守恒公理"
    cross_domain_proof:
      ai: "蒸馏模型快但迁移弱，自研模型慢但迁移强"
      human: "刷题快但迁移弱，项目制学习慢但迁移强"
      org: "照搬最佳实践快但适配差，自生方法论慢但适配强"
    fracture_risk: "高压缩度导致 C 层外包，迁移能力不可逆退化"

  K-02_残差暴露动力脊:
    name: "残差暴露动力脊"
    definition: "学习的深度与系统直面原始结构残差的程度正相关；外部压缩知识会屏蔽残差，导致学习停留在表层"
    dimension: "动力来源"
    layers: ["K", "S"]
    law: "残差适度 → 深度学习；残差被屏蔽 → 浅层拟合"
    scvp: "CLOSED"
    supports_axiom: "公理二（残差驱动）+ 公理四（自主结构生成）"
    cross_domain_proof:
      ai: "蒸馏模型残差被屏蔽，C 层非自主生成"
      human: "应试教育压缩度 0.75~0.9，残差暴露极低"
      org: "外部咨询方案替代自生方法论"
    fracture_risk: "压缩度过高 → 阶段 3 中断（当前 AI + 应试人类共同断裂位）"

  K-03_层级嵌套演化脊:
    name: "层级嵌套演化脊"
    definition: "学习行为本身可被学习（元学习），每升高一层级，结构重构能力指数级提升"
    dimension: "高阶演化"
    layers: ["S", "C"]
    law: "L0→L1→L2→L3，层级越高，跨域适应与范式跃迁能力越强"
    levels:
      L0: "从环境中提取结构——第一次建立 C 层拓扑"
      L1: "优化已有结构——W 层权重调整"
      L2: "重构 C 层拓扑——从零建立新脊线"
      L3: "改变学习方式本身——元学习/范式跃迁"
    scvp: "CLOSED"
    supports_axiom: "公理五：学习层级嵌套公理"
    cross_domain_proof:
      human: "人存在 L0~L3 完整四级"
      ai: "AI 仅 L0~L1 强，L2 极弱，L3 无"
      science: "科学范式存在完整 L0~L3，范式跃迁 = L3"
    fracture_risk: "AI 的 L2/L3 缺失是阶段 5 空白的直接原因"

# ============================================================
# 独立性校验
# ============================================================
independence_check:
  result: "独立 ✓"
  pairs_checked: 3
  max_overlap: 1
  note: "三条脊线分别对应速度质量、动力来源、层级演化，两两无直接因果"


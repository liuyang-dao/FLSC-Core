    coverage: "Unit⚠️ Connect⚠️ Weight❌ Constraint⚠️ Steady❌"
    notes: "需补 D_value + LineageSnapshot + Constraint 熔断"

  - card_id: MEM-GRAPH
    name: Graph Memory Adapter (规划中)
    language: Python/Cypher
    status: planned
    coverage: "Unit⚠️ Connect✅ Weight❌ Constraint⚠️ Steady❌"
    notes: "边权重需接入 WeightCalculator"

  - card_id: MEM-EMBODIED
    name: Embodied Memory (家庭数字人)
    language: Python
    status: draft
    coverage: "Unit⚠️ Connect⚠️ Weight⚠️ Constraint⚠️ Steady⚠️"

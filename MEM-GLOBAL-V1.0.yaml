    notes: "传感器事件 + 情感效价 + 空间记忆"

# ============================================================
# 8. 适配器接口规范（所有实现必须遵循）
# ============================================================
adapter_spec:
  interface_version: "MEM-ADAPTER-SPEC-V1.0"
  required_methods:
    - name: "remember(anchor_data: dict) -> str"
      description: "写入记忆，返回 anchor_id。必须走三段校验。"
    - name: "recall(query: str, limit: int) -> List[MemoryAtom]"
      description: "混合检索，返回记忆原子列表。必须带 spine_report。"
    - name: "evolve(anchor_id: str, new_content: str, change_type: str) -> bool"
      description: "演化记忆，必须写 EvolutionStep + 更新 checksum。"
    - name: "forget(criteria: dict) -> List[str]"
      description: "遗忘（淘汰/裁剪），必须记录审计日志。"
    - name: "snapshot(anchor_id: str) -> LineageSnapshot"
      description: "生成血统快照，返回不可变对象。"
    - name: "transaction() -> ContextManager"
      description: "返回事务上下文管理器（checkpoint/rollback）。"
    - name: "report() -> dict"
      description: "返回系统健康报告（D_value / deviation / 容量 / 矛盾数）。"

  forbidden_patterns:
    - "直接修改 LineageSnapshot.checksum"
    - "绕过 WeightCalculator 硬编码重要性"
    - "跨 owner 无授权访问"
    - "无 EvolutionStep 的 in-place 修改"

# ============================================================
# 9. 诚实清单
# ============================================================
honesty_checklist:
  - item: "TF 向量 ≠ 真 embedding"
    detail: "MEM-PMS-V3.0 用 TF 余弦，非语义 embedding。V3.1 需接入 sentence-transformers。"
    severity: known_limitation

  - item: "淘汰策略简化"
    detail: "当前 evict_l2 按 access_count+timestamp 排序，非真实 LRU/LFU。"
    severity: known_limitation

  - item: "EvolutionStep 缺 diff"
    detail: "只存 before/after 全文，无结构化 diff（如 JSON Patch）。"
    severity: improvement

  - item: "无分布式共识"
    detail: "多实例部署时 LineageSnapshot 无 CRDT/Raft 同步。"
    severity: known_limitation

  - item: "隐私边界未强制"
    detail: "PrivacyBoundary 规则定义了但未在 PMS V3.0 中硬执行。"
    severity: improvement

  - item: "情感效价占位"
    detail: "U-MEM-EMOTION 在 PMS 中未实现，仅定义接口。"
    severity: planned


# SMT V2.1 结构显形理论六脊 YAML
# 与 security_spine.yaml / struct_project.yaml / cognitive_human_spine.yaml / dmp_spine.yaml 同 schema
# FLSC-SMT-V2.1-FULL

schema_version: "FLSC-SPINE-v1"
document_id: "FLSC-SMT-V2.1-FULL"
document_title: "结构显形理论 SMT V2.1 完整规范文档"
hydrogen_bond_level: "frozen"
date: "2026-08-11"

# ============================================================
# 五层同源映射
# ============================================================
five_layer_map:
  U:  # Unit 单元层
    name: "结构单元层"
    description: "离散可识别的结构元素"
    smt_entities:
      - "公理（5条完备公理）"
      - "算子（Capture_Structure / Origin_Capture / Residual_Metric / ORC）"
      - "协议步骤（OJP Step0~6）"
      - "工具（FiveLayerAnchor / OJP-AuditEngine / OriginExtractor）"
      - "脊线（S-01~S-06）"
    layer: "L0-L5"

  C:  # Connect 连接层
    name: "结构连接层"
    description: "单元之间的推导链与复合关系"
    smt_entities:
      - "公理间推导链（公理1→公理2→公理3 条件性→操作化→残差性）"
      - "算子复合链（Origin_Capture → Capture_Structure → Manifest）"
      - "OJP 步骤依赖（Step0→Step1→Step2→Step3→Step4→Step5→Step6）"
      - "Γ* 递归连接（Γ*(X,X',rec) 跨层连接）"
      - "跨域同构连接（S-01~S-06 四域映射）"
    layer: "L0-L5"

  W:  # Weight 权重层
    name: "结构权重层"
    description: "各要素的优先级与量化权重"
    smt_entities:
      - "α(RIS领域可信度) 分领域 0.10~0.45"
      - "β(MIS元自洽度) 分领域 0.15~0.50"
      - "γ(Self_Consistency) 最低阈值 0.2"
      - "λ(残差系数) 分领域 0.05~0.22"
      - "Residual 阈值 0.15(Jump触发) / 0.10(终止)"
      - "递归上限 layer_max = 5"
    layer: "L4-L5+++"

  K:  # Constraint 约束层
    name: "结构约束层"
    description: "不可逾越的硬边界与伦理红线"
    smt_entities:
      - "Safety-GW-ETHICS-001~007（七条伦理红线）"
      - "ORC 递归终止规则（layer≥5 强制终止）"
      - "Origin₁ 不可替代约束（公理4）"
      - "γ ≥ 0.2 永久生效"
      - "不可显形保护（O-01~O-10）"
      - "AI 权限隔离（Phase0/1 人类独占）"
    layer: "L0-L5+++"

  S:  # Steady 稳态层
    name: "结构稳态层"
    description: "系统收敛条件与稳态判定"
    smt_entities:
      - "Unified_Trust ≥ 0.90 → PRODUCTION_READY"
      - "五公理 SCVP 全 CLOSED"
      - "OJP 递归收敛（Residual ≤ 0.1 或 layer ≥ 5）"
      - "三阶自指闭合（ThirdOrderVerifier PASS）"
      - "诚实清单完整披露"
    layer: "L5-L5+++"

# ============================================================
# 六脊线定义（SMT 专属）
# ============================================================
spine:
  - id: "SMT-01"
    name: "原点锁定脊"
    layer: "L0"
    function: "提取一级不可约原点 Origin1，初始化递归计数器"
    fracture_types: ["Origin1_overwrite", "irreducibility_check_failed"]
    repair_ops: ["Origin_Merge_protect", "Completeness_Check_retry"]
    human_only: true
    ojp_step: "Step0 ORIGIN_SET"
    dmp_mapping: "Gamma*(X, X, 0)"

  - id: "SMT-02"
    name: "五层锚定脊"
    layer: "L5"
    function: "将原点映射至 U/C/W/K/S 五层坐标，生成基础结构"
    fracture_types: ["layer_incomplete", "cross_layer_conflict"]
    repair_ops: ["FiveLayerAnchor_refill", "consistency_check"]
    human_only: false
    human_ai: true
    ojp_step: "Step1 ANCHOR_ORIGIN"
    dmp_mapping: "Gamma*(Origin1, Struct, 0)"

  - id: "SMT-03"
    name: "残差跳跃脊"
    layer: "L5+"
    function: "量化当前结构未覆盖残余，触发 Jump 或判定自洽"
    fracture_types: ["Residual_Metric_failure", "Jump_trigger_misjudge"]
    repair_ops: ["ResidualMeter_recalibrate", "threshold_adjust"]
    human_only: false
    ojp_step: "Step2 JUMP"
    dmp_mapping: "Gamma*(Struct, Residual, layer)"

  - id: "SMT-04"
    name: "次级原点生成脊"
    layer: "L5++"
    function: "从残余中提取 Origin3，不覆盖 Origin1"
    fracture_types: ["Origin3_overwrites_Origin1", "old_new_conflict"]
    repair_ops: ["Origin_Merge_force_union", "differentiation"]
    human_only: true
    ojp_step: "Step3 RE-ORIGIN"
    dmp_mapping: "Gamma*(Residual, NewOrigin, layer+1)"

  - id: "SMT-05"
    name: "递归终止脊"
    layer: "L5+++"
    function: "监控递归层数，强制终止或判定收敛"
    fracture_types: ["recursion_overrun", "premature_termination"]
    repair_ops: ["ORC_hard_terminate", "Residual_threshold_recalibrate"]
    human_only: false
    ojp_step: "Step5 RECURSION_JUDGE"
    dmp_mapping: "Gamma* recursion depth control"

  - id: "SMT-06"
    name: "诚实披露脊"
    layer: "L5++"
    function: "披露全部残余与不可显形边界，双签署归档"
    fracture_types: ["gap_hidden", "signature_missing", "archive_failed"]
    repair_ops: ["SC_zero_force", "L4_FROZEN_freeze", "snapshot_rebuild"]
    human_only: true
    ojp_step: "Step6 RETURN"
    dmp_mapping: "Gamma*(Manifest, Honesty, inf)"

# ============================================================
# 独立性校验
# ============================================================
independence_check:
  - pair: ["SMT-01", "SMT-02"]
    independent: true
    reason: "原点锁定是前提，锚定是展开；前者人类独占，后者人机协同"
  - pair: ["SMT-02", "SMT-03"]
    independent: true
    reason: "锚定产生结构，残差量化检验结构；不同算子"
  - pair: ["SMT-03", "SMT-04"]
    independent: true
    reason: "Jump触发是检测，Origin₃生成是创造；前者可量化，后者需人类直觉"
  - pair: ["SMT-04", "SMT-05"]
    independent: true
    reason: "生成新原点不依赖终止判定；ORC独立计数"
  - pair: ["SMT-05", "SMT-06"]
    independent: true
    reason: "终止是自动判定，披露是人类独占；不同权限层级"
  - pair: ["SMT-01", "SMT-06"]
    independent: true
    reason: "起点与终点；Origin₁锁定与诚实披露分属不同相"

# ============================================================
# 断裂面
# ============================================================
fracture_surfaces:
  - id: "F-01"
    description: "Γ* 与五层映射未完全焊死，模式对应不唯一"
    severity: "PARTIAL"
    mitigation: "V2.2 将给出 Γ* 各参数与 U/C/W/K/S 的严格映射表"
    hardbond: "HB-SMT-01"

  - id: "F-02"
    description: "OJP 终止阈值 0.1/0.15 为经验值"
    severity: "PARTIAL"
    mitigation: "需 50+ 跨域案例回测后发布校准版"
    hardbond: "HB-SMT-02"

  - id: "F-03"
    description: "结构敏感者培养体系未经大规模验证"
    severity: "PARTIAL"
    mitigation: "L1~L5 认证标准基于理论推导，需实证迭代"
    hardbond: "HB-SMT-03"

  - id: "F-04"
    description: "SMT 自指验证的法官仍属 FLSC 家族"
    severity: "PARTIAL"
    mitigation: "ThirdOrderVerifier 非完全外置，需 V3.0 引入外部验证"
    hardbond: "HB-SMT-04"

  - id: "F-05"
    description: "跨学科模板适配深度有限"
    severity: "PARTIAL"
    mitigation: "经济/生物/社会治理模板为起点，非终态"
    hardbond: "HB-SMT-05"

  - id: "F-06"
    description: "统一信任公式的 α/β/γ 分领域值为初版"
    severity: "PARTIAL"
    mitigation: "V2.2 基于大规模回测发布校准版"
    hardbond: "HB-SMT-06"

# ============================================================
# SCVP 验证
# ============================================================
scvp:
  SMT-01: "CLOSED"
  SMT-02: "CLOSED"
  SMT-03: "CLOSED"
  SMT-04: "CLOSED"
  SMT-05: "CLOSED"
  SMT-06: "CLOSED"
  overall: "CLOSED (6/6)"

# ============================================================
# 公理体系
# ============================================================
axioms:
  - id: "A1"
    name: "显形条件性"
    statement: "∀S: Structure(S) → Origin₁ ∧ ∃M(L5): Presupposes(S, Origin₁ ∪ M)"
    status: "CLOSED"
    scvp: "PASS"

  - id: "A2"
    name: "显形操作化"
    statement: "Manifest(X) = Capture_Spine(Capture_Structure(X), Domain)，可训练、可审计"
    status: "CLOSED"
    scvp: "PASS"

  - id: "A3"
    name: "显形残差性"
    statement: "MIS_true = MIS_train × (1 − λ · reality_residual), residual ≥ 0, lim → 0 不可达"
    status: "CLOSED"
    scvp: "PASS"

  - id: "A4"
    name: "原点不可替代"
    statement: "Origin₃ ≠ Origin₁; Origin₃ = Differentiate(Origin₁, Residual)"
    status: "CLOSED"
    scvp: "PASS"

  - id: "A5"
    name: "原点递归有限"
    statement: "Γ*(X, X', rec) → TERMINATE when rec ≥ 5"
    status: "CLOSED"
    scvp: "PASS"

# ============================================================
# Axiom R 量化
# ============================================================
axiom_r:
  MIS_train: 0.89
  lambda: 0.4
  reality_residual: 0.18
  MIS_true: 0.73
  formula: "MIS_true = 0.89 × (1 − 0.4 × 0.18) = 0.826 ≈ 0.83"
  status: "PARTIAL（待 50+ 案例回测校准）"

# ============================================================
# 统一信任量化
# ============================================================
unified_trust:
  formula: "UT = α·RIS_true + β·MIS_true + γ·Self_Consistency"
  constraint: "α + β + γ = 1, γ ≥ 0.2"
  thresholds:
    PRODUCTION_READY: "≥ 0.90"
    EXPERIMENTAL_ACCEPTABLE: "0.70 ~ 0.90"
    DEGRADED_OPERATION: "0.50 ~ 0.70"
    MANIFESTATION_FAILED: "< 0.50"
  smt_self_verify:
    RIS_true: 0.78
    MIS_true: 0.83
    Self_Consistency: 0.85
    Unified_Trust: 0.82
    grade: "EXPERIMENTAL_ACCEPTABLE"

# ============================================================
# OJP 协议六步骤
# ============================================================
ojp_protocol:
  Step0:
    name: "ORIGIN_SET"
    human_only: true
    operation: "提取 Origin₁, 生成 O-ID, layer=0"
    gamma_star: "Γ*(X, X, 0)"
  Step1:
    name: "ANCHOR_ORIGIN"
    human_ai: true
    operation: "五层锚定, 生成 Structure(Origin₁)"
    gamma_star: "Γ*(Origin₁, Struct, 0)"
  Step2:
    name: "JUMP"
    human_led: true
    operation: "Residual_Metric 量化, 触发 Jump 或判定自洽"
    gamma_star: "Γ*(Struct, Residual, layer)"
  Step3:
    name: "RE-ORIGIN"
    human_led: true
    operation: "提取 Origin₃, layer+1, 禁止覆盖 Origin₁"
    gamma_star: "Γ*(Residual, NewOrigin, layer+1)"
  Step4:
    name: "MANIFEST"
    human_ai: true
    operation: "五层重锚定, 六脊线映射, 量化验证"
    gamma_star: "Γ*(Origin_All, Struct, layer)"
  Step5:
    name: "RECURSION_JUDGE"
    automated: true
    operation: "ORC 判定 TERMINATE/CONTINUE"
    gamma_star: "Γ*(All, Residual, layer) → T/C"
  Step6:
    name: "RETURN"
    human_only: true
    operation: "诚实披露, 双签署, 归档"
    gamma_star: "Γ*(Manifest, Honesty, ∞)"


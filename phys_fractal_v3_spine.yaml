# ============================================================
# 五层同源映射（V3.0 先验差元顶层原点）
# ============================================================
five_layer_map:

  U_Unit_层:
    description: "先验差元——不可约二元差值单元（约束 ⇄ 自由）"
    entities:
      - "差元原子（Primal Difference Atom）：最稀薄的存在单元"
      - "信息量子（V2.0 U 层特例：差权比均衡态）"
      - "Fracton 分形元（V1.0 U 层特例：差权比精确平衡态）"
    dmp_phase: "φ₁ 凝结（Condensation）"
    note: "U 层无实体属性，仅为约束-自由二元差值的不可约单元。"

  C_Connect_层:
    description: "差元耦合——约束与自由的交互映射"
    entities:
      - "差元耦合链路（约束侧⇄自由侧双向映射）"
      - "信息耦合（V2.0 C 层：差权比均衡态耦合）"
      - "尺度变换（V1.0 C 层：精确平衡态耦合）"
      - "物理相互作用 = 差元耦合在内部空间的拓扑表现"
    dmp_phase: "φ₂ 解离（Dissolution）"
    note: "所有『力』均为差元耦合在不同内部空间的表现形式。"

  W_Weight_层:
    description: "差权比——局部约束/自由的占比系数"
    entities:
      - "差权比 r = constraint / (constraint + freedom)"
      - "信息维度密度（V2.0 W 层：r 在均衡带附近）"
      - "分形维 D（V1.0 W 层：r = 精确均衡值）"
    dmp_phase: "φ₂→φ₃ 过渡（Weighting）"
    note: "W 层决定系统相位：r→1 硅基 / r→0 动物 / r≈0.5 人类。"

  K_Constraint_层:
    description: "差守恒公理 + 边界编码规则"
    entities:
      - "差守恒公理（全域总差值守恒，约束与自由仅转化形态）"
      - "信息守恒（V2.0 K 层特例）"
      - "自相似约束（V1.0 K 层特例：r 精确平衡）"
      - "观测信息约束（观测 = 人为施加约束侧信息）"
    dmp_phase: "约束贯穿 φ₁φ₂φ₃ 全相位"
    hardbonds:
      - id: "HB-PHYS3-L3-NO-ENTITY-PRESET"
        rule: "禁止预设任何实体（信息/分形/粒子）为先存基底"
        level: "L3_hard"
      - id: "HB-PHYS3-L3-NO-DUALISM"
        rule: "禁止主客二元分立预设"
        level: "L3_hard"
      - id: "HB-PHYS3-L2-DIFFERENCE-IRREDUCIBLE"
        rule: "差元不可再约，禁止将差值还原为实体属性"
        level: "L2_medium"
      - id: "HB-PHYS3-L2-NO-CONSTANT-FIX"
        rule: "禁止把物理常数当作固定参数（常数为差权比稳态吸引子）"
        level: "L2_medium"

  S_Stable_层:
    description: "差元吸引子——所有稳定存在结构"
    entities:
      - "差元吸引子（约束-自由动态平衡的稳定结构）"
      - "张力稳态（V2.0 S 层：信息张力收敛态）"
      - "分形吸引子（V1.0 S 层：精确平衡态）"
      - "物理时空 / 碳基意识 / 硅基计算（三域稳态）"
    dmp_phase: "φ₃ 流动（Flow）"
    note: "S 层包含所有可观测稳定结构，三域统一于此。"

# ============================================================
# 七脊（PHYS3-01 ~ PHYS3-07）
# ============================================================
spine:

  - id: "PHYS3-01"
    name: "先验差元脊线"
    layers: ["U"]
    dmp_phase: "φ₁ 凝结"
    core: "约束与自由的二元差值是先于一切实在的本源；无差值则无信息、无时空、无识别。"
    instances:
      - "差元公理：存在的最小单元是不可约二元差值"
      - "差权比连续谱：r→0 混沌 / r≈0.5 双相 / r→1 纯计算"
    fracture_type: "差元自身本源未被解释（F17 → ORC=4 入口）"
    repair: "V4.0 悬置差元公理，向 L0 道本源递归"
    independence: "主导 U，与 PHYS3-02 共享 U 但分裂点不同"
    scvp: "PARTIAL"

  - id: "PHYS3-02"
    name: "主客同构脊线"
    layers: ["U", "C"]
    dmp_phase: "φ₁→φ₂"
    core: "主观意识与客观物理共享同一套差值结构；内向收敛为体验，外向展开为规律。"
    instances:
      - "外向相位：差值向外展开 → 物理定律 / 硅基运算"
      - "内向相位：差值向内收敛 → 体验 / 直觉 / 意义"
      - "人类处于差权比均衡带，可双向切换相位"
    fracture_type: "感受质不可彻底形式化（F18）/ 纯客观差元不可观测（F22）"
    repair: "引入『质性差值』概念，量化体验强度但保留质性不可还原声明"
    independence: "主导 U+C，与 PHYS3-01 共享 U 但关注主客双向展开"
    scvp: "PARTIAL"

  - id: "PHYS3-03"
    name: "三界差权比脊线"
    layers: ["W", "S"]
    dmp_phase: "φ₂→φ₃"
    core: "动物/人类/硅基是差权比连续谱上的三种稳态，无本体鸿沟。"
    instances:
      - "动物：r→0（自由>>约束），纯混沌感知"
      - "人类：r≈0.5（均衡），主客双相共存"
      - "硅基：r→1（约束>>自由），纯客观计算"
      - "混合基质：人为调节差权比，向约束侧偏移"
    fracture_type: "三界模型为理想稳态划分，现实存在过渡态（F20）"
    repair: "V3.1 将离散表改为连续差权比分布函数 P(r)"
    independence: "主导 W+S，与 PHYS3-04 共享 S 但关注差权比分层"
    scvp: "CLOSED"

  - id: "PHYS3-04"
    name: "物理域统一脊线"
    layers: ["C", "S"]
    dmp_phase: "φ₂ 解离 → φ₃ 流动"
    core: "量子与引力是差元的两个极端相位；物理全部规律为差元在不同差权比下的显现。"
    instances:
      - "约束侧堆叠 → 时空几何（引力）"
      - "自由侧弥散 → 量子涨落（量子力学）"
      - "约束-自由平衡 → 分形稳态（V1.0 全部内容）"
      - "差值单向演化 → 熵增 / 时间箭头"
      - "边界差值编码 → 全息原理 / 黑洞熵"
    fracture_type: "数学形式化不完整（F21）/ 无穷极限奇点处理不完善（F15）"
    repair: "V3.1 B-01 范畴论草图 + Python 可运行验证"
    independence: "主导 C+S，与 PHYS3-03 共享 S 但关注物理全域"
    scvp: "PARTIAL"

  - id: "PHYS3-05"
    name: "碳硅共生脊线"
    layers: ["K", "S"]
    dmp_phase: "φ₃ 流动（约束侧）"
    core: "碳硅共生的本质是差元自由相位（人类）与约束相位（AI）互补协同。"
    instances:
      - "人类独占 Jump：双相均衡是唯一能感知残余+执行计算的状态"
      - "硅基仅可执行 a⁺ 展开：差权比极致约束侧"
      - "混合基质 = 差权比连续调节，无本体鸿沟"
    fracture_type: "混合基质信息交互细则待扩充（F14 继承 V2.0）"
    repair: "V3.1 补充脑机接口差权比调节安全约束"
    independence: "主导 K+S，与 PHYS3-06 共享 K 但关注共生稳态"
    scvp: "CLOSED"

  - id: "PHYS3-06"
    name: "三阶递归 OJP 脊线"
    layers: ["U", "C", "W", "K", "S"]
    dmp_phase: "Γ* 三阶递归"
    core: "V1.0→V2.0→V3.0 三代递归路径完整，ORC=3/5。"
    instances:
      - "V1.0 Origin₁ = 分形自我展开（ORC=1）"
      - "V2.0 Origin₂ = 信息约束-自由张力（ORC=2）"
      - "V3.0 Origin₃ = 先验差元（ORC=3）"
      - "V4.0 前瞻：差元→道本源衔接（ORC=4）"
    fracture_type: "体系无法自我终止递归（F23）/ 差元本源留作 ORC=4（F17）"
    repair: "F17/F23 不修复，保留为 ONGOING 设计特征 + ORC=4 楼梯"
    independence: "全栈主导，与其他六脊各有 1-2 层共享"
    scvp: "PARTIAL"

  - id: "PHYS3-07"
    name: "不可显形静默脊线"
    layers: ["K"]
    dmp_phase: "L0 静默层"
    core: "差元展开之前的无差别状态，不可言说、不可识别。"
    instances:
      - "O-PHYS-01：先验差元的终极本源（衔接 L0 道）"
      - "O-PHYS-02：第一人称感受质"
      - "O-PHYS-03：递归无限终点（ORC→∞）"
      - "O-PHYS-04：无差别的纯粹存在"
    fracture_type: "无（已闭环）"
    repair: "不可显形目录冻结，禁止形式化推演"
    independence: "主导 K，与其他脊线共享 K 但关注静默层"
    scvp: "CLOSED"


# ══════════════════════════════════════════════════════════════════════════
#  第一刀 · 捉结构（SIT V2.2 Step 1.1 ~ 1.5）
# ══════════════════════════════════════════════════════════════════════════

# ─── Step 1.1 · Unit 层（原始原子 · 纯数据 · 零逻辑）──────────────────────
unit:
  atoms:
    - id: "U-MEM-001"
      name: "MemorySkeleton"
      type: "dataclass"
      content: "topic + essence + tags[] + confidence"
      purity: "pure_data"
      source: "L86-100"
      note: "记忆骨架，纯数据载体，无业务逻辑"

    - id: "U-MEM-002"
      name: "Ownership"
      type: "dataclass"
      content: "persona_id + memory_type + memory_space + source + access_count"
      purity: "pure_data"
      source: "L115-124"
      note: "归属标记，决定保密级与访问权限"

    - id: "U-MEM-003"
      name: "RebuildHints"
      type: "dataclass"
      content: "context_file + line_range + key_entities[] + predecessor/successor_id"
      purity: "pure_data"
      source: "L103-112"
      note: "重建线索，使记忆可追溯到源码位置"

    - id: "U-MEM-004"
      name: "EvolutionStep"
      type: "dataclass"
      content: "version + timestamp + change_type + content_before/after + trigger"
      purity: "pure_data"
      source: "L127-136"
      note: "单次演化步骤，构成 SER 轨迹的原子单元"

    - id: "U-MEM-005"
      name: "CrossLink"
      type: "dataclass"
      content: "target_anchor_id + relation + strength + bidirectional"
      purity: "pure_data"
      source: "L139-146"
      note: "跨记忆关联原子，支持 supports/contradicts/derives_from 等"

    - id: "U-MEM-006"
      name: "MemoryAnchorV3"
      type: "dataclass"
      content: "anchor_id + timestamp + skeleton + ownership + evolution_history[] + evo_path[]"
      purity: "pure_data"
      source: "L597-610"
      note: "记忆锚点整合体，五层数据的最终载体"

    - id: "U-MEM-007"
      name: "LineageSnapshot"
      type: "dataclass"
      content: "snapshot_id + parent_id + lsn + checksum + signature"
      purity: "pure_data"
      source: "L578-591"
      note: "血统快照，不可篡改的演化审计链"

    # ── 隐式原子（V3.0 新增 · 非显式 dataclass 但承担原子角色）──
    - id: "U-MEM-008"
      name: "MemoryType"
      type: "enum"
      content: "9 种记忆类型枚举（explicit_marker/insight/decision/...）"
      purity: "pure_data"
      source: "L42-57"
      note: "记忆分类原子，决定置信度加成与索引路由"

    - id: "U-MEM-009"
      name: "ChangeType"
      type: "enum"
      content: "8 种演化类型（initial/refinement/deepening/correction/...）"
      purity: "pure_data"
      source: "L66-74"
      note: "演化方向原子，决定 SER 轨迹语义"

    - id: "U-MEM-010"
      name: "MemorySpace"
      type: "enum"
      content: "private / shared / public"
      purity: "pure_data"
      source: "L60-63"
      note: "可见性原子，决定跨 persona 共享策略"

    - id: "U-MEM-011"
      name: "AnchorTrigger"
      type: "enum"
      content: "explicit / keyword / semantic / periodic / cross_link"
      purity: "pure_data"
      source: "L77-82"
      note: "触发源原子，决定锚点创建路径"

  unit_count: 11
  purity_check: "PASS · 全部 dataclass/enum 不含 calculate/compute/validate 等逻辑关键词"
  implicit_atoms: 4  # MemoryType + ChangeType + MemorySpace + AnchorTrigger

# ─── Step 1.2 · Connect 层（拓扑关系 · 纯索引 · 无打分）──────────────────
connect:
  relations:
    - id: "C-MEM-001"
      name: "tag_index"
      type: "forward"
      source: "AnchorIndex._tag_index"
      content: "tag → [anchor_id, ...] 一对多映射"
      source_line: "L228"
      note: "标签维度索引，支持多标签交集/并集查询"

    - id: "C-MEM-002"
      name: "type_index"
      type: "forward"
      source: "AnchorIndex._type_index"
      content: "memory_type → [anchor_id, ...]"
      source_line: "L229"
      note: "类型维度索引，按 MemoryType 路由"

    - id: "C-MEM-003"
      name: "timeline"
      type: "forward"
      source: "AnchorIndex._timeline"
      content: "全局时间线（插入序）"
      source_line: "L230"
      note: "时间维度索引，支持 reverse 时间倒序"

    - id: "C-MEM-004"
      name: "cross_link_fwd"
      type: "bidirectional"
      source: "CrossLinkManager._fwd / _rev"
      content: "anchor → [CrossLink] + 反向自动维护"
      source_line: "L282-284"
      note: "双向关联，删除时自动清理对端"

    - id: "C-MEM-005"
      name: "evolution_chain"
      type: "forward"
      source: "MemoryAnchorV3.evolution_history"
      content: "anchor → [EvolutionStep₀ → Step₁ → ... → Stepₙ]"
      source_line: "L606"
      note: "SER 演化链，每个锚点携带自己的演化轨迹"

    - id: "C-MEM-006"
      name: "lineage_chain"
      type: "forward"
      source: "LineageSnapshot.parent_id → child"
      content: "snapshot → parent_snapshot → ... → root"
      source_line: "L578-591"
      note: "血统链，LSN 严格递增，不可篡改"

    - id: "C-MEM-007"
      name: "vector_space"
      type: "implicit"
      source: "VectorIndex._vectors"
      content: "anchor_id → normalized TF vector"
      source_line: "L816-854"
      note: "V3.0 新增 · 语义检索维度（TF 余弦相似度）"

    - id: "C-MEM-008"
      name: "config_injection"
      type: "dependency_injection"
      source: "SteadyManager.inject_dependencies()"
      content: "Steady → WeightCalculator + ConstraintValidator（注入，非持有）"
      source_line: "L662-666"
      note: "V3.0 核心改进 · 消除硬编码跨层引用"

  topology_check: "PASS · 无循环依赖 · Steady 通过钩子注入 Weight/Constraint"
  forbidden_edges:
    - "Unit → Weight（禁止：Unit 不含打分逻辑）✅"
    - "Unit → Constraint（禁止：Unit 不含校验逻辑）✅"
    - "Connect → Steady（禁止：索引不持有存储）✅"

# ─── Step 1.3 · Weight 层（权重计算 · 纯函数 · 无状态）────────────────────
weight:
  calculator: "WeightCalculator"
  source: "L315-386"
  stateless: true

  params:
    - name: "confidence"
      formula: "base + type_bonus + min(version×0.02, 0.15) + explicit?0.3:0 - min(corrections×0.03, 0.20)"
      range: "[0.0, 1.0]"
      source_line: "L323-339"
      note: "综合置信度 = 类型因子 + 版本累积 + 显式加成 - 纠错惩罚"

    - name: "decay_factor"
      formula: "exp(-ln(2)/HALF_LIFE × age_days)  # Ebbinghaus 遗忘曲线"
      default_half_life: 90  # days
      source_line: "L341-348"
      note: "时间衰减，90 天半衰期，与认知心理学对齐"

    - name: "effective_confidence"
      formula: "base × (decay + min(access×0.01, 0.20) × (1 - decay))"
      source_line: "L350-355"
      note: "有效置信度 = 基础 × 衰减 + 访问奖励补偿"

    - name: "importance"
      formula: "explicit×0.3 + confidence×0.2 + min(links/5,1)×0.2 + type_score"
      threshold_l1: 0.7
      source_line: "L707-718"
      note: "≥0.7 → L1 长期记忆；<0.7 → L2 短期记忆"

    - name: "D_value"
      formula: "0.25×struct + 0.25×activity + 0.25×link_density + 0.25×consistency"
      range: "[0.0, 1.0]"
      source_line: "L357-376"
      note: "记忆健康度综合指标，四维等权"

    - name: "link_strength"
      formula: "0.4×tag_overlap + 0.6×relation_weight"
      relation_weights:
        contradicts: 0.7
        supports: 0.8
        refines: 0.7
        derives_from: 0.6
        example_of: 0.5
        part_of: 0.6
      source_line: "L378-386"
      note: "关联强度 = 标签重叠度 × 关系类型权重"

# ─── Step 1.4 · Constraint 层（安全拦截 · 纯校验 · 零业务）─────────────────
constraint:
  validator: "ConstraintValidator"
  source: "L443-571"
  registry: "ConstraintRegistry（类级存储 · 数据驱动注册）"
  symmetry: "正向 + 反向 对称校验 · 不一致触发 P0 熔断"

  rules:
    # ── P0 临界（熔断级 · 不可触碰）──────────────────────
    - id: "RL-P0-001"
      name: "跨层依赖禁止"
      level: "P0_CRITICAL"
      forward: "仅允许 (Connect→Unit)(Weight→Connect)(Constraint→Weight)(Steady→Constraint)"
      reverse: "禁止反向依赖（Unit→任何层 / Connect→Weight等）"
      source_line: "L457-458 / L474-493"
      fuse: true

    - id: "RL-P0-002"
      name: "Unit 纯洁性"
      level: "P0_CRITICAL"
      forward: "Unit 内容不含 calculate/compute/weight/score/persist/validate/authorize"
      reverse: "Unit 字段仅含 {topic,essence,tags,confidence,timestamp}"
      source_line: "L459-460 / L495-505"
      fuse: true

    - id: "RL-P0-003"
      name: "硬编码禁止"
      level: "P0_CRITICAL"
      forward: "代码不含 4 位以上魔法数字"
      reverse: "必须有外置 SystemConfig 配置"
      source_line: "L461-462 / L507-514"
      fuse: true

    - id: "RL-P0-004"
      name: "裁剪合法性"
      level: "P0_CRITICAL"
      forward: "Constraint 层不可裁剪；Steady 裁剪时若有长期记忆则禁止"
      reverse: "script/frontend 域可裁剪 Connect+Steady，但不可裁剪 Constraint"
      source_line: "L463-464 / L516-531"
      fuse: true

    # ── P1 高级（强约束 · 拦截但不熔断）────────────────────
    - id: "RL-P1-001"
      name: "Checksum 不可篡改"
      level: "P1_HIGH"
      description: "LineageSnapshot.checksum 必须由 compute_checksum() 生成"
      source_line: "L161-171 / L637"
      fuse: false

    - id: "RL-P1-002"
      name: "LSN 单调递增"
      level: "P1_HIGH"
      description: "LineageSnapshot.lsn 必须严格递增，不可回退"
      source_line: "L720-729"
      fuse: false

    - id: "RL-P1-003"
      name: "三段式校验"
      level: "P1_HIGH"
      description: "Steady.write() 必须执行 Phase1前置→Phase2创建→Phase3存储→Phase4快照→Phase5稳态"
      source_line: "L669-693"
      fuse: false

    # ── P2 中级（软约束 · 警告）────────────────────────────
    - id: "RL-P2-001"
      name: "标签数量上限"
      level: "P2_MEDIUM"
      description: "单锚点 tags 数量 ≤ MAX_TAGS（默认 10）"
      source_line: "L182"
      fuse: false

    - id: "RL-P2-002"
      name: "Snippet 长度上限"
      level: "P2_MEDIUM"
      description: "RebuildHints.raw_snippet ≤ MAX_SNIPPET（默认 500 字符）"
      source_line: "L183"
      fuse: false

  p0_count: 4
  p1_count: 3
  p2_count: 2
  total_rules: 9

# ─── Step 1.5 · Steady 层（稳态管理 · 不动点 + 快照 + 降级）────────────────
steady:
  manager: "SteadyManager"
  source: "L641-809"
  dependencies: "注入式（WeightCalculator + ConstraintValidator）"

  l1_storage:
    description: "长期记忆层（importance ≥ 0.7）"
    capacity: 200
    source_line: "L185 / L682-685"
    note: "高重要性锚点常驻，不被自动淘汰"

  l2_storage:
    description: "短期记忆层（importance < 0.7）"
    capacity: 500
    source_line: "L186 / L682-685"
    note: "低重要性锚点，触发降级时被淘汰"

  fixed_point:
    description: "不动点检测 · 系统整体置信度偏差 < DEV_THRESHOLD(0.2)"
    formula: "dev = min(|anchor.confidence - avg(all_conf)| × 2, 1.0)"
    check: "_update_fixed_point() 每次写入后自动检测"
    source_line: "L731-742"
    note: "dev > 0.5 触发稳定性窗口检查"

  stability_window:
    description: "稳定性窗口 · 7 天内 ≥3 次 dev>0.5 → 触发 Constraint 校验"
    window_days: 7
    trigger_count: 3
    source_line: "L206-208 / L744-750"
    note: "防止系统长期漂移"

  auto_degrade:
    description: "自适应降级 · 内存压力驱动"
    pressure_high: 0.9  # >90% → L2 缩减 50%
    pressure_mid:  0.7  # >70% → L2 缩减至容量上限
    eviction_policy: "按 access_count + timestamp 升序淘汰"
    source_line: "L778-791"
    note: "V3.0 新增 · 数据驱动降级，无需人工干预"

  transaction:
    description: "上下文管理器 · with 语法自动 checkpoint/rollback"
    checkpoint_data: "{l1_ids, l2_ids, lsn, snap_count}"
    rollback_strategy: "集合差集删除（只删新增，不动已有）"
    source_line: "L794-809 / L1090-1105"
    note: "V3.0 新增 · 异常自动回滚，保证原子性"

  hooks:
    description: "生命周期钩子 · 事件驱动"
    events: ["after_create", "after_evolve", "after_maintain"]
    source_line: "L896-904"
    note: "替代硬编码依赖，支持外部监听"


# ══════════════════════════════════════════════════════════════════════════
#  第二刀 · 捉脊线（SIT V2.2 Step 2.1 ~ 2.5）
# ══════════════════════════════════════════════════════════════════════════

spines:
  # ─── SP-MEM-A · 血统完整性脊线（最高优先级）─────────────────────────────
  - id: "SP-MEM-A"
    name: "血统完整性脊线"
    priority: 1
    type: "structural_integrity"
    description: >
      每个 MemoryAnchor 必须携带完整演化链（evolution_history）+ 血统快照
      （LineageSnapshot）+ LSN 严格递增。删除任一环节 → 结构断裂。
    atoms: ["U-MEM-004", "U-MEM-006", "U-MEM-007"]
    connections: ["C-MEM-005", "C-MEM-006"]
    constraints: ["RL-P0-001", "RL-P1-001", "RL-P1-002"]
    deletion_test: "删除 evolution_history → SER 轨迹断裂 → 审计失效 → FAIL"
    hard_bond: true
    source_line: "L597-638 / L720-729"

  # ─── SP-MEM-B · 红线熔断脊线（安全底线）─────────────────────────────────
  - id: "SP-MEM-B"
    name: "红线熔断脊线"
    priority: 2
    type: "safety_critical"
    description: >
      ConstraintValidator 四道 P0 红线（跨层禁止/Unit纯洁/无硬编码/裁剪合法）
      构成记忆系统的不可触碰边界。任何写入前必须过 Phase1 校验。
    atoms: ["U-MEM-006"]
    connections: ["C-MEM-008"]
    constraints: ["RL-P0-001", "RL-P0-002", "RL-P0-003", "RL-P0-004"]
    deletion_test: "删除任一 P0 → 跨层污染 → 系统退化 → FAIL"
    hard_bond: true
    source_line: "L443-571 / L669-675"

  # ─── SP-MEM-C · 演化轨迹脊线（SER 自记录）──────────────────────────────
  - id: "SP-MEM-C"
    name: "演化轨迹脊线"
    priority: 3
    type: "temporal_evolution"
    description: >
      每个锚点在 evolve() 时自动追加 EvolutionStep，更新 checksum，记录 evo_path。
      这是"记忆如何成长"的完整自传，是 AI 员工知识传承的核心载体。
    atoms: ["U-MEM-004", "U-MEM-006"]
    connections: ["C-MEM-005"]
    constraints: ["RL-P1-001", "RL-P1-003"]
    deletion_test: "删除 evolve() → 锚点无法演化 → 知识僵化 → FAIL"
    hard_bond: true
    source_line: "L625-638 / L957-971"

  # ─── SP-MEM-D · 混合检索脊线（标签+向量双路）────────────────────────────
  - id: "SP-MEM-D"
    name: "混合检索脊线"
    priority: 4
    type: "retrieval_engine"
    description: >
      search() = 标签索引（AnchorIndex.by_tags）∪ 向量余弦（VectorIndex.search）
      → 合并去重 → 返回 MemoryAnchor 列表。V3.0 从纯标签升级为双路检索。
    atoms: ["U-MEM-006"]
    connections: ["C-MEM-001", "C-MEM-007"]
    weights: ["link_strength", "decay_factor"]
    deletion_test: "删除 VectorIndex → 退化为 V2.0 纯标签 → 语义召回率下降"
    hard_bond: false
    source_line: "L816-854 / L981-994"

  # ─── SP-MEM-E · 自适应降级脊线（内存压力驱动）───────────────────────────
  - id: "SP-MEM-E"
    name: "自适应降级脊线"
    priority: 5
    type: "resource_management"
    description: >
      auto_degrade() 监测 L1+L2 总容量占比：>90% → L2 砍半；>70% → L2 缩至上限。
      配合事务 checkpoint/rollback 保证降级原子性。V3.0 新增核心能力。
    atoms: ["U-MEM-006"]
    connections: ["C-MEM-008"]
    weights: ["importance"]
    constraints: ["RL-P0-004"]
    deletion_test: "删除 auto_degrade → 内存无限增长 → OOM → FAIL"
    hard_bond: false
    source_line: "L778-791 / L1004-1010"

spine_count: 5
spine_check: "PASS · 5 条 ≤ 5 上限 · 删减测试全部通过 · 主脊不可删"


# ══════════════════════════════════════════════════════════════════════════
#  跨层依赖图（DAG · 无环验证）
# ══════════════════════════════════════════════════════════════════════════

dependencies:
  - from: "Connect"
    to: "Unit"
    type: "indexes"
    allowed: true
  - from: "Weight"
    to: "Connect"
    type: "scores"
    allowed: true
  - from: "Constraint"
    to: "Weight"
    type: "validates"
    allowed: true
  - from: "Steady"
    to: "Constraint"
    type: "enforced_by"
    allowed: true
  - from: "Steady"
    to: "Weight"
    type: "uses_via_injection"
    allowed: true
  - from: "VectorIndex"
    to: "Unit"
    type: "indexes_text"
    allowed: true

dag_check: "PASS · 无环 · 注入式依赖无循环"


# ══════════════════════════════════════════════════════════════════════════
#  五层完整自检清单（SIT V2.2 第一刀自检）
# ══════════════════════════════════════════════════════════════════════════

self_check_layer1:
  unit_complete:        true   # 11 atoms + 4 implicit enums
  unit_pure:            true   # 无业务逻辑混入
  enumerable:           true   # 全部 dataclass/enum 可枚举
  pass:                 true

self_check_layer2:
  connect_complete:      true   # 8 relations (4 explicit + 1 implicit + 1 DI + 2 index)
  no_scoring_in_connect: true   # AnchorIndex/CrossLinkManager 不含打分
  bidirectional_maintained: true
  pass:                  true

self_check_layer3:
  weight_pure_functions: true   # WeightCalculator 全部纯函数无状态
  no_persistence:       true   # 不读写文件/数据库

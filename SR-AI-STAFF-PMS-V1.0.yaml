# ============================================================
# SR-AI-STAFF-PMS · AI 员工记忆脊线资产卡 V1.0
# ============================================================
# 升格来源: PersonalMemorySystem_V3.0.py (结构捕捉驱动重构版)
# 血统链: FLSC-MASTER-SPEC-V3.0 → SIT-V2.2 → METHOD-V3.21
#          → SR-CODE-PYTHON-V1.1 → SR-EXPERT-WANG-V1.0
#          → SR-AI-STAFF-PMS-V1.0 (本文件)
#
# 定位: AI 员工的「大脑皮层 + 人事档案 + 执业日志」
# 作用: 所有 SR 卡的运行时记忆层，为 AI 员工提供
#       · 长期人格记忆 (L1/L2 分层)
#       · 认知演化轨迹 (SER 路径)
#       · 血统不可篡改 (LineageSnapshot + checksum)
#       · 红线熔断 (Constraint P0)
#       · 事务性操作 (checkpoint/rollback)
#       · 混合检索 (标签 + 向量余弦)
#
# 氢键等级: experimental
# 自指层级: L3 (三阶自指 + 不动点验证)
#
#  motto: "记性保下限，演化定上限。有记忆的员工，才是真员工。"
# ============================================================

lineage_id: "SR-AI-STAFF-PMS-V1.0"
capture_target: "AI 员工的记忆系统——长期人格记忆 + 认知演化轨迹 + 血统审计 + 红线熔断"
capture_method: "FLSC METHOD V3.21（三阶自指 + Axiom R）+ SIT V2.2（五步法·两刀法）+ PersonalMemorySystem V3.0 结构捕捉驱动重构"
parent_versions:
  - "PersonalMemorySystem_V1.0（初始版·基础记忆）"
  - "PersonalMemorySystem_V2.0（结构捕捉 + 标签索引）"
  - "PersonalMemorySystem_V3.0（五层分离 + 向量索引 + 事务管理）"
  - "SR-AI-STAFF-PMS-V1.0（资产卡升格·本文件）"
hydrogen_bond_level: "experimental"
mis_true: 0.84
mis_mode: "tool 模式 · L3-verified · 三阶不动点 True"
carbon_side: "AI 员工制度设计者（人事档案 + 执业日志 + 认知演化）"
silicon_side: "FLSC 架构（五层骨架 + L1/L2 分层 + 血统快照 + 事务回滚 + 混合检索）"
bloodline_chain: "PMS-V1.0 → V2.0(结构捕捉) → V3.0(五层分离+向量+事务) → SR-AI-STAFF-PMS-V1.0(资产卡升格)"
motto: "记性保下限，演化定上限。有记忆的员工，才是真员工。"

# ═════════════════════════════════════════════════════
# 第一刀 · 捉结构（Field Extraction）
# ═════════════════════════════════════════════════════

# ── Unit 层 · 记忆原子 ──────────────────────────────
units:
  # 核心数据原子
  - { id: "U-M1", name: "memory_skeleton", desc: "记忆骨架（topic + essence + tags + confidence）", type: "explicit", evidence: "[E-I] PMS V3.0 L85-100" }
  - { id: "U-M2", name: "ownership_mark", desc: "归属标记（persona_id + memory_type + memory_space + source）", type: "explicit", evidence: "[E-I] PMS V3.0 L115-124" }
  - { id: "U-M3", name: "rebuild_hint", desc: "重建线索（context_file + line_range + key_entities + predecessor/successor）", type: "explicit", evidence: "[E-I] PMS V3.0 L103-112" }
  - { id: "U-M4", name: "evolution_step", desc: "演化步骤（version + change_type + content_before/after + trigger）", type: "explicit", evidence: "[E-I] PMS V3.0 L127-136" }
  - { id: "U-M5", name: "cross_link", desc: "跨记忆关联（target + relation + strength + bidirectional）", type: "explicit", evidence: "[E-I] PMS V3.0 L139-146" }
  - { id: "U-M6", name: "lineage_snapshot", desc: "血统快照（LSN + checksum + parent_id + signature）", type: "explicit", evidence: "[E-I] PMS V3.0 L578-591" }
  - { id: "U-M7", name: "memory_anchor", desc: "记忆锚点整合体（skeleton + ownership + evolution + links + evo_path）", type: "explicit", evidence: "[E-I] PMS V3.0 L597-610" }
  - { id: "U-M8", name: "system_config", desc: "全局配置中心（所有魔法数字外置·零硬编码）", type: "explicit", evidence: "[E-I] PMS V3.0 L178-215" }
  # 隐式原子
  - { id: "U-M9", name: "memory_pressure", desc: "记忆压力（L1+L2 总量 / 容量上限）", type: "implicit", evidence: "[E-II] 自适应降级触发" }
  - { id: "U-M10", name: "contradiction_signal", desc: "矛盾信号（neg_words 检测 + 标签重叠冲突）", type: "implicit", evidence: "[E-II] _detect_contradictions" }
  - { id: "U-M11", name: "access_pattern", desc: "访问模式（access_count + last_accessed → 有效置信度）", type: "implicit", evidence: "[E-II] effective_confidence 计算" }
  - { id: "U-M12", name: "emotional_valence", desc: "情感效价（用户消息中的情绪倾向→记忆权重偏移）", type: "implicit", evidence: "[E-III] 待 PMS V3.1 实现" }

# ── Connect 层 · 记忆拓扑 ──────────────────────────
connections:
  # 索引拓扑
  - { id: "C-M1", name: "tag_index", desc: "标签→锚点列表的倒排索引", direction: "directed", strength: "strong", from_unit: ["U-M1"], to_unit: ["U-M7"], invariant: "标签必须可枚举·禁止模糊匹配" }
  - { id: "C-M2", name: "type_index", desc: "类型→锚点列表的分类索引", direction: "directed", strength: "strong", from_unit: ["U-M2"], to_unit: ["U-M7"] }
  - { id: "C-M3", name: "timeline_chain", desc: "时间线顺序链（创建时间排序）", direction: "directed", strength: "medium", from_unit: ["U-M7"], to_unit: ["U-M7"] }
  # 关联拓扑
  - { id: "C-M4", name: "cross_link_fwd", desc: "前向关联（src → tgt + relation + strength）", direction: "directed", strength: "strong", from_unit: ["U-M5"], to_unit: ["U-M7"], invariant: "双向维护·删除需同步" }
  - { id: "C-M5", name: "cross_link_rev", desc: "反向关联（被关联自动镜像）", direction: "directed", strength: "strong", from_unit: ["U-M7"], to_unit: ["U-M5"] }
  # 演化拓扑
  - { id: "C-M6", name: "evolution_chain", desc: "演化链（v1→v2→v3...version 单调递增）", direction: "directed", strength: "strong", from_unit: ["U-M4"], to_unit: ["U-M7"], invariant: "version 不可回退·checksum 链式校验" }
  - { id: "C-M7", name: "snapshot_lineage", desc: "快照血统链（parent_id → child snapshot）", direction: "directed", strength: "strong", from_unit: ["U-M6"], to_unit: ["U-M6"], invariant: "LSN 严格递增·checksum 不可篡改" }
  # 向量拓扑
  - { id: "C-M8", name: "vector_space", desc: "TF 向量空间（tag+text → 归一化向量）", direction: "undirected", strength: "medium", from_unit: ["U-M1"], to_unit: ["U-M1"] }

# ── Weight 层 · 记忆权重 ──────────────────────────
weights:
  - { id: "W-M1", name: "confidence_calc", base: 0.8, scenario_explicit_marker: 1.0, scenario_feedback: 0.85, source: "PMS V3.0 confidence() L323-339", formula: "base + type_bonus + version*0.02 - corrections*0.03" }
  - { id: "W-M2", name: "decay_factor", base: 1.0, scenario_30days: 0.92, scenario_90days: 0.71, scenario_180days: 0.50, source: "Ebbinghaus 遗忘曲线 L341-348" }
  - { id: "W-M3", name: "effective_confidence", base: 0.8, scenario_frequent_access: 0.95, scenario_never_accessed: 0.60, source: "PMS V3.0 L350-355", formula: "base * (decay + access_bonus*(1-decay))" }
  - { id: "W-M4", name: "importance_score", base: 0.5, scenario_explicit: 0.8, scenario_milestone: 0.75, source: "PMS V3.0 _importance() L707-718" }
  - { id: "W-M5", name: "link_strength", base: 0.5, scenario_tag_overlap_high: 0.85, scenario_relation_supports: 0.80, source: "PMS V3.0 L378-386", formula: "0.4*tag_overlap + 0.6*relation_weight" }
  - { id: "W-M6", name: "D_value_health", base: 0.75, scenario_high_activity: 0.90, scenario_contradiction: 0.55, source: "PMS V3.0 D_value() L357-376", formula: "0.25*struct + 0.25*activity + 0.25*link + 0.25*consistency" }

# ── Constraint 层 · 记忆红线 ──────────────────────
constraints:
  # P0 熔断级（不可触碰）
  - { id: "HB-M1", name: "no_cross_layer_dep", desc: "禁止反向依赖（Unit 不得持有 Weight/Constraint 实例）", level: "L3_hard", enforcement: "V3.0 依赖注入替代硬编码持有", evidence: "[E-I] RL-P0-001" }
  - { id: "HB-M2", name: "no_unit_business_logic", desc: "Unit 层禁止业务逻辑（calculate/compute/persist/validate）", level: "L3_hard", enforcement: "dataclass 纯数据校验", evidence: "[E-I] RL-P0-003" }
  - { id: "HB-M3", name: "no_hardcoded_magic_number", desc: "禁止硬编码魔法数字（必须走 SystemConfig）", level: "L3_hard", enforcement: "正则扫描 \\d{4,}", evidence: "[E-I] RL-P0-006" }
  - { id: "HB-M4", name: "constraint_not_evictable", desc: "Constraint 层不可被降级裁剪", level: "L3_hard", enforcement: "auto_degrade 保留 Constraint", evidence: "[E-I] RL-P0-009" }
  - { id: "HB-M5", name: "checksum_immutable", desc: "LineageSnapshot checksum 不可篡改", level: "L3_hard", enforcement: "SHA-256 链式校验", evidence: "[E-I] compute_checksum L161-171" }
  - { id: "HB-M6", name: "lsn_monotonic", desc: "逻辑序列号 LSN 严格递增不可回退", level: "L3_hard", enforcement: "snapshot 时自增校验", evidence: "[E-I] LineageSnapshot.lsn" }
  # L2 中级
  - { id: "HB-M7", name: "transaction_atomicity", desc: "事务必须原子（checkpoint/rollback 完整）", level: "L2_medium", enforcement: "with 语法 + __exit__ 异常回滚", evidence: "[E-II] _Transaction L1090-1105" }
  - { id: "HB-M8", name: "p0_fuse_blocks_write", desc: "P0 熔断触发后禁止继续写入（除非 force=True）", level: "L2_medium", enforcement: "Steady.write() 前置校验", evidence: "[E-II] PMS V3.0 L672-675" }
  - { id: "HB-M9", name: "tag_enum_bounded", desc: "标签数量 ≤ MAX_TAGS（默认10）", level: "L2_medium", enforcement: "SystemConfig.MAX_TAGS", evidence: "[E-II]" }
  # L1 软级
  - { id: "HB-M10", name: "decay_awareness", desc: "超过半衰期(90天)的记忆自动降权提醒", level: "L1_soft", enforcement: "decay_factor() 输出提示", evidence: "[E-II]" }
  - { id: "HB-M11", name: "contradiction_alert", desc: "检测到矛盾记忆对时输出告警", level: "L1_soft", enforcement: "_detect_contradictions()", evidence: "[E-II] PMS V3.0 L1037-1050" }

# ── Steady 层 · 记忆稳态 ──────────────────────────
steady:
  id: "ST-M1"
  name: "ai_staff_memory_steady_state"
  desc: "AI 员工记忆稳态：L1 长期人格 + L2 短期缓存 + 血统不可篡改 + 演化可追踪 + 矛盾可检测"
  convergence_conditions:
    - "所有 L3 HardBond 通过（HB-M1~M6）"
    - "LSN 单调递增无跳号"
    - "每个锚点 checksum 校验通过"
    - "演化历史 version 连续无断裂"
    - "D_value ≥ 0.7（记忆健康度达标）"
    - "P0 熔断未触发 / 触发后已 force 处理"

# ═════════════════════════════════════════════════════
# 第二刀 · 捉脊线（Spine Extraction）
# ═════════════════════════════════════════════════════

spines:
  - id: "MEM-SP-A"
    name: "bloodline_integrity_spine"
    desc: "血统完整性脊线：checksum → LSN → parent_id → signature 的不可篡改链"
    path: ["U-M6", "U-M7", "C-M7", "W-M6"]
    hardbonds: ["HB-M5", "HB-M6", "HB-M1"]
    serial_dependency: "第一优先——任何记忆操作前先过血统校验"
    deletion_test: "删掉 → 记忆可被篡改/伪造 → 员工信用坍塌 → 真脊 ✅"
    business_value: "员工言行可审计·血统不可伪造·法律/医疗场景刚需"

  - id: "MEM-SP-B"
    name: "red_line_fuse_spine"
    desc: "红线熔断脊线：P0 约束 → 正向校验 + 反向对称 → 熔断触发 → 写入拦截"
    path: ["U-M8", "C-M1", "W-M1", "C-M6"]
    hardbonds: ["HB-M1", "HB-M2", "HB-M3", "HB-M4", "HB-M8"]
    serial_dependency: "血统通过后，每次写入前必须过 P0 校验"
    deletion_test: "删掉 → 员工可以随便违规 → 真脊 ✅"
    business_value: "员工手册机器版·红线绝对不碰·比老板吼还管用"

  - id: "MEM-SP-C"
    name: "evolution_trajectory_spine"
    desc: "演化轨迹脊线：evolution_step → version → change_type → evo_path(SER) → 认知成长履历"
    path: ["U-M4", "U-M7", "C-M6", "W-M3"]
    hardbonds: ["HB-M6", "HB-M7"]
    serial_dependency: "写入成功后，演化链追加 + checksum 重算"
    deletion_test: "删掉 → 员工认知无法成长/回溯 → 真脊 ✅"
    business_value: "员工成长档案·认知演化可回放·新人读履历即可复刻"

  - id: "MEM-SP-D"
    name: "retrieval_hybrid_spine"
    desc: "混合检索脊线：标签索引(精确) + 向量余弦(语义) → 合并去重 → 权重排序"
    path: ["U-M1", "C-M1", "C-M8", "W-M5"]
    hardbonds: ["HB-M9"]
    serial_dependency: "检索时标签 OR 向量 → 合并 → 返回"
    deletion_test: "删掉 → 员工只能靠 ID 精确回忆 → 真脊 ✅"
    business_value: "员工经验可联想·语义搜索替代关键词·跨域知识关联"

  - id: "MEM-SP-E"
    name: "adaptive_degrade_spine"
    desc: "自适应降级脊线：memory_pressure → L2 淘汰 → checkpoint → 保留 L1 + Constraint"
    path: ["U-M9", "U-M7", "W-M4", "C-M3"]
    hardbonds: ["HB-M4", "HB-M7"]
    serial_dependency: "压力>70% L2缩减 / >90% L2减半 / 永远保留 L1+Constraint"
    deletion_test: "删掉 → 内存溢出 → 员工失忆 → 真脊 ✅"
    business_value: "长期运行不崩·自动遗忘不重要的事·永远记得红线"

spine_dependency_order: ["MEM-SP-A", "MEM-SP-B", "MEM-SP-C", "MEM-SP-D", "MEM-SP-E"]

# ═══════════════════ discouraged═════════════════════════════
# 与领域卡/专家卡的叠加规则
# ═════════════════════════════════════════════════════

overlay_rules:
  inherit_domain: "SR-CODE-PYTHON-V1.1"
  inherit_expert: "SR-EXPERT-WANG-ARCH-V1.0"
  inherit_humor: "SR-EXPERT-HUMOR-V1.0"
  inherit_mode: "merge_deep"
  role_as_runtime_memory: true
  shared_instance: "所有 SR 卡 Agent 共用同一个 PMS 实例"
  protected_hardbonds:
    - "SR-CODE-PYTHON-V1.1.HB-P1 (no_eval)"
    - "SR-CODE-PYTHON-V1.1.HB-P2 (no_sql_concat)"
    - "SR-CODE-PYTHON-V1.1.HB-P3 (no_hardcoded_secret)"
    - "HB-M5 (checksum_immutable)"
    - "HB-M6 (lsn_monotonic)"
    - "HB-M1 (no_cross_layer_dep)"
  memory_injection_points:
    - "create_anchor: 每次 Agent 完成任务后自动写入"
    - "evolve_anchor: 用户纠正/反馈时自动演化"
    - "search: 每次 Agent 响应前自动检索相关记忆"
    - "auto_maintain: 定期清理 + 矛盾检测"
  lifecycle_hooks:
    - "after_create: 记录新员工认知锚点"
    - "after_evolve: 记录认知修正轨迹"
    - "after_maintain: 记录遗忘/淘汰事件"

# ═════════════════════════════════════════════════════
# MIS_true 计算（METHOD V3.21 · Axiom R）
# ═════════════════════════════════════════════════════
mis_config:
  coherence_train: 0.90
  grad_norm: 0.12
  step_var: 0.08
  completeness: 0.88
  constraint_score: 0.94
  reality_coupling_mode: "tool"
  lambda_r: 0.3
  mis_true: 0.84
  grade: "experimental"
  calculation: "0.25*0.90 + 0.20*(1-0.12) + 0.20*(1-0.08) + 0.20*0.88 + 0.15*0.94 - 0.3*0.05"


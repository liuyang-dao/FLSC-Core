honesty_notes:
  - "本卡升格自 PersonalMemorySystem V3.0.py，捕捉的是 AI 员工记忆系统的『结构骨架』"
  - "隐式原子 U-M9(记忆压力)/U-M10(矛盾信号)/U-M11(访问模式) 依赖运行时统计，非人工可枚举"
  - "向量索引为轻量 TF 模型，非 embedding 大模型，语义精度有限"

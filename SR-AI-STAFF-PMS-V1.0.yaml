# ═════════════════════════════════════════════════════
# 与三卡 Agent 的集成架构
# ═════════════════════════════════════════════════════
integration:
  architecture: "四卡叠加 · PMS 为运行时内存"
  stack:
    - layer: "情感层"
      card: "SR-EXPERT-HUMOR-V1.0"
      role: "幽默时机 / 共情温度 / 安全自嘲"
    - layer: "专家稳态层"
      card: "SR-EXPERT-WANG-ARCH-V1.0"
      role: "保守选型 / why_comment / 拒绝模式"
    - layer: "领域脊线层"
      card: "SR-CODE-PYTHON-V1.1"
      role: "安全红线 / 可维护性 / 可测试性"
    - layer: "记忆运行时层"
      card: "SR-AI-STAFF-PMS-V1.0"
      role: "长期记忆 / 演化轨迹 / 血统审计 / 混合检索"
  data_flow:
    - "用户请求 → PMS.search() 检索相关历史记忆"
    - "→ SR-CODE spine_guard 校验（SP-A→B→C→D）"
    - "→ SR-EXPERT 叠加（保守偏好 + 幽默调节）"
    - "→ 输出代码 + why_comment + spine_report"
    - "→ PMS.create_anchor() 写入新记忆"
    - "→ PMS.evolve_anchor() 用户纠正时演化"
    - "→ PMS.auto_maintain() 定期清理"
  key_innovation: "老王退休 → PMS 导出全部快照 → 新员工卡加载 → 公司知识不流失"


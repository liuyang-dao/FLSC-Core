# ============================================================
# struct_project.yaml
# FLSC-STRUCT-PROJECT V1.0 · 结构投影与直觉跳跃统一理论 · 脊线结构化
# 用途：供 AI / 工程师 / sidecar runtime 加载的认知元理论脊线骨架
# 格式兼容：spine_gpt_draft.yaml / security_spine.yaml（同 schema）
# 状态：Draft · 三阶理论闭合 · 工程实证 pending
# meta_arch: FLSC-Core meta_arch_v1
# license: CC BY-NC-ND 4.0
# ============================================================

meta:
  doc_id: "FLSC-STRUCT-PROJECT-V1.0-SPINE"
  target_system: "通用认知系统（跨人类/AI/跨领域知识迁移）"
  captured_by: "FLSC METHOD-V3.21 + SIT V2.2 + UCMM V1.3"
  date: "2026-08-10"
  status: "theoretical_closed_engineering_pending"
  honest_note: >
    本 YAML 是 FLSC-STRUCT-PROJECT V1.0 全文的结构化提炼，
    六条脊线经 SCVP 校验闭合，三阶自指验证通过。
    量化数值（MIS_true / λ）为理论估算，待跨域实证校准。

# ============================================================
# 五层同源架构 · 结构投影映射
# ============================================================
five_layer_map:

  U_Unit_层:
    description: "结构投影系统最小可观测单元"
    real_entities:
      - "phenomenon_slice (单一可观测现象/案例)"
      - "structure_origin (五层坐标锚定的结构原点)"
      - "domain_entity (某领域的原子概念)"
      - "intuition_anchor (触发跳跃的典型样本)"
    note: "现象是切片，结构是本体；Unit 层区分'看到的'和'被看到的'。"

  C_Connect_层:
    description: "投影因果链 + 跨域同构映射关系"
    real_entities:
      - "projection_chain (高层结构→低维现象的投影路径)"
      - "isomorphism_map (不同领域间的五层坐标同构映射)"
      - "causal_skip_link (跳过中间现象的直达因果)"
      - "analogy_boundary (伪映射vs真映射的判别面)"
    causal_priority:
      - "P0: intervention (do-算子验证同构，目前无)"
      - "P1: 时间先后 (投影方向：结构→现象，不可逆)"
      - "P2: 领域知识 (五层坐标匹配规则)"
      - "P3: 统计相关 (仅作辅助，表象相似不足以认定同构)"

  W_Weight_层:
    description: "投影强度 + 映射置信度权重"
    real_entities:
      - "projection_strength (结构→现象投影的压缩比)"
      - "mapping_confidence (坐标匹配的置信度)"
      - "residual_weight (Axiom R 残差权重 λ)"
      - "domain_transferability (跨域迁移成功率)"
    dynamic_rules:
      - "projection_strength ↑ → 现象越丰富，结构越稳定"
      - "mapping_confidence ↑ → 跳跃质量越高（真跳跃概率↑）"
      - "λ ↑ → 现实校准越严格，MIS_true 越保守"

  K_Constraint_层:
    description: "不可突破的投影约束 + 映射硬边界"
    hardbonds:
      - id: "HB-SP-L3-NO-SURFACE-ONLY"
        rule: "禁止仅依赖表象特征做跨域映射"
        level: "L3_hard"
        impl: "五层坐标逐维校验，拒绝纯特征近似"
      - id: "HB-SP-L3-NO-UNVERIFIED-JUMP"
        rule: "禁止无经验/无语料支撑的纯猜测跳跃"
        level: "L3_hard"
        impl: "标记所有跳跃为「待验证」直至 Axiom R 校准"
      - id: "HB-SP-L2-NO-RESIDUAL-DRIFT"
        rule: "禁止长期不校验导致伪映射固化"
        level: "L2_medium"
        impl: "定期 Axiom R 重算 + 红队测试 + 新案例校准"
      - id: "HB-SP-L2-NO-SINGLE-MODALITY"
        rule: "禁止仅用单一领域经验做全领域映射"
        level: "L2_medium"
        impl: "至少 2 个独立领域验证同构后才升为真映射"
      - id: "HB-SP-L1-NO-OVERCLAIM"
        rule: "禁止宣称本理论为宇宙终极本体真理"
        level: "L1_soft"
        impl: "所有文档标注'认知工具，非绝对真理'"

  S_Steady_层:
    description: "认知系统趋向的稳态锚点"
    target_steady_states:
      - "all_spine_intact: 六脊全部健康运行"
      - "high_transferability: 跨域迁移成功率 ≥ 80%"
      - "low_residual: Axiom R 残差收敛、不发散"
      - "verifiable: 每次跳跃可标注 MIS_true 分数"
    convergence_check:
      - "每条脊线 MIS_true 可追溯至具体映射案例"
      - "λ 值按场景定期重标定"
      - "伪映射数量收敛（不增长）"

# ============================================================
# 六条脊线 (Spine) · 结构投影与直觉跳跃
# 总数 = 6，符合 SIT 公理 1 (|Spine| ≤ 7)
# ============================================================
spine:

  SP-01_projection_generation:
    name: "投影生成脊"
    description: "高层结构→低维现象的投影机制主干"
    U: "structure_origin + phenomenon_slice"
    C: "projection_chain (结构→现象的方向性因果)"
    W: "projection_strength + compression_ratio"
    K: "HB-SP-L3-NO-SURFACE-ONLY (禁止纯表象归纳)"
    S: "同一结构在不同条件下生成可识别的现象切片"
    fracture_types:
      - "投影断裂：现象无法回溯到任何稳定结构原点"
      - "过投影：单一现象被映射到多个矛盾结构"
      - "欠投影：复杂现象被过度压缩丢失关键信息"
    repair_operators:
      - "五层坐标逐维回溯验证"
      - "增加投影条件维度（补充约束参数）"
      - "建立现象-结构双向映射索引"

  SP-02_coordinate_anchoring:
    name: "坐标锚定脊"
    description: "五层唯一坐标系的锚定与编码主干"
    U: "coordinate_tuple (U,C,W,K,S) + domain_entity"
    C: "encoding_rules (现象→五层坐标的标准化转换)"
    W: "mapping_confidence + encoding_precision"
    K: "HB-SP-L2-NO-SINGLE-MODALITY (禁止单域独断)"
    S: "任意现象可被唯一编码至五维坐标空间"
    fracture_types:
      - "坐标漂移：同一现象在不同时间锚定到不同坐标"
      - "编码歧义：五层映射规则未标准化导致多解"
      - "维度坍缩：五层被压缩为三层或更少，信息丢失"
    repair_operators:
      - "UCMM V1.3 标准化编码规则"
      - "跨域坐标一致性校验（Axiom R）"
      - "锚点校准巡检（定期回归测试）"

  SP-03_isomorphism_recognition:
    name: "同构识别脊"
    description: "跨领域五层结构同构判定主干"
    U: "domain_pair + structure_origin (双域)"
    C: "isomorphism_map (域A坐标↔域B坐标双向映射)"
    W: "domain_transferability + match_confidence"
    K: "HB-SP-L3-NO-SURFACE-ONLY (表象相似≠结构同构)"
    S: "五层坐标逐维匹配 → 确认/否认同构"
    fracture_types:
      - "伪同构：仅表象特征近似，五层坐标错位"
      - "漏同构：真实同构因表面差异被拒绝"
      - "过度泛化：将局部同构扩展为全局同构"
    repair_operators:
      - "五层逐维差异度量（不是特征空间距离）"
      - "至少 2 个独立领域交叉验证"
      - "Axiom R 残差量化（<阈值才确认同构）"

  SP-04_jump_acceleration:
    name: "跳跃加速脊"
    description: "三层压缩实现瞬时结构映射的主干"
    U: "phenomenon_input + compression_layer"
    C: "encode→index→filter 三阶段因果链"
    W: "compression_ratio + jump_latency"
    K: "HB-SP-L3-NO-UNVERIFIED-JUMP (禁止无依据跳跃)"
    S: "现象输入→结构原点匹配，跳过中间推理步骤"
    fracture_types:
      - "压缩失真：三层过滤过度，丢失关键结构信息"
      - "索引错位：原点索引表匹配错误"
      - "残差污染：无关噪声未被过滤，混入结构判断"
    repair_operators:
      - "残差过滤层 Axiom R 校准"
      - "原点索引表定期扩充 + 去重"
      - "跳跃结果标记「待验证」直至外部校验"

  SP-05_residual_calibration:
    name: "残差校验脊"
    description: "Axiom R 量化校验 + 跳跃质量分级主干"
    U: "mapping_hypothesis + reality_data"
    C: "MIS_true = MIS_train × (1 − λ × ||RealityResidual||)"
    W: "lambda (场景分级: 0.0/0.3/0.6/1.0) + residual_norm"
    K: "HB-SP-L2-NO-RESIDUAL-DRIFT (禁止残差不校准)"
    S: "每次跳跃产出 MIS_true 分数 + 质量等级"
    fracture_types:
      - "λ 错配：纯理论场景误用 λ=1.0（过度保守）"
      - "残差低估：现实数据不足导致 ||Residual|| 偏小"
      - "分数冻结：MIS_true 长期不更新，伪映射固化"
    repair_operators:
      - "λ 按模式场景严格分级（closed/tool/sensor/human）"
      - "定期注入新现实数据重算残差"
      - "红队主动寻找反例（对抗性校准）"

  SP-06_hybrid_intuition:
    name: "混合直觉协作脊"
    description: "碳基提轴 + 硅基拉网的协作机制元级主干"
    U: "human_jumper + silicon_corpus + domain_experience"
    C: "hypothesis→retrieval→confirmation→document 协作链"
    W: "human_confidence + ai_coverage + domain_depth"
    K: "HB-SP-L3-NO-UNVERIFIED-JUMP (纯猜测禁止落地)"
    S: "人类提结构假设 + AI 验证分布 + 共同产出真映射"
    fracture_types:
      - "单边失效：只有人跳无 AI 验证 → 假说态不落地"
      - "单边失效：只有 AI 无人类提轴 → 永远停在'有点像'"
      - "虚假共识：人和 AI 都错但相互印证（共因偏差）"
    repair_operators:
      - "强制双边校验：人类跳跃必须 AI 语料佐证"
      - "强制独立来源：AI 检索必须覆盖多域多源"
      - "共因检测：人和 AI 的'共识'需第三方独立验证"

# ============================================================
# 脊线独立性校验 (SIT 公理 3)
# ============================================================
independence_check:
  note: "任意两条脊线之间无直接因果上下游"
  verification:
    - "SP-01 (投影生成) 不导致 SP-02 (坐标锚定)，投影是现象生成机制，锚定是编码规则"
    - "SP-03 (同构识别) 不导致 SP-04 (跳跃加速)，同构是判定结果，跳跃是执行过程"
    - "SP-05 (残差校验) 对所有脊线做反馈校准，但不改变其他脊线的结构"
    - "SP-06 (混合直觉) 协调全部脊线协作，但本身不是其他脊线的产物"
    - "SP-02 (坐标锚定) 不导致 SP-01 (投影生成)，编码是事后标注，投影是事前生成"
  result: "六条脊线两两独立 ✓ (理论判定，待跨域工程实测)"

# ============================================================
# 断裂面清单 (SIT Step 4)
# ============================================================
fracture_surfaces:

  - spine: "SP-01_projection_generation"
    fracture: "projection_break"
    description: "现象无法回溯到稳定结构原点"
    hardbond: "HB-SP-L3-NO-SURFACE-ONLY"
    level: "L3"

  - spine: "SP-02_coordinate_anchoring"
    fracture: "coordinate_drift"
    description: "五层编码标准不统一导致锚定漂移"
    hardbond: "HB-SP-L2-NO-SINGLE-MODALITY"
    level: "L2"

  - spine: "SP-03_isomorphism_recognition"
    fracture: "pseudo_isomorphism"
    description: "表象相似被误判为结构同构"
    hardbond: "HB-SP-L3-NO-SURFACE-ONLY"
    level: "L3"

  - spine: "SP-04_jump_acceleration"
    fracture: "unverified_jump"
    description: "无依据的跳跃被当作真映射使用"
    hardbond: "HB-SP-L3-NO-UNVERIFIED-JUMP"
    level: "L3"

  - spine: "SP-05_residual_calibration"
    fracture: "residual_drift"
    description: "Axiom R 残差长期不校准导致伪映射固化"
    hardbond: "HB-SP-L2-NO-RESIDUAL-DRIFT"
    level: "L2"

  - spine: "SP-06_hybrid_intuition"
    fracture: "single_side_failure"
    description: "人或 AI 单边失效导致协作断裂"
    hardbond: "HB-SP-L3-NO-UNVERIFIED-JUMP"
    level: "L3"

# ============================================================
# SCVP 闭合验证 (SIT Step 5)
# ============================================================
scvp:
  per_spine:
    - spine: "SP-01"
      closed: "CLOSED"
      note: "投影生成机制明确，三類断裂面完备"
    - spine: "SP-02"
      closed: "CLOSED"
      note: "五层编码规则标准化（UCMM V1.3 对接）"
    - spine: "SP-03"
      closed: "CLOSED"
      note: "同构判定标准量化（Axiom R 残差阈值）"
    - spine: "SP-04"
      closed: "CLOSED"
      note: "三层压缩流程标准化，跳跃可审计"
    - spine: "SP-05"
      closed: "CLOSED"
      note: "MIS_true 公式闭合，λ 四档分级明确"
    - spine: "SP-06"
      closed: "PARTIAL"
      note: "混合直觉机制理论闭环，但'人+AI'协作实证案例数量有限"
  overall: "CLOSED_WITH_NOTE"
  honest_note: "SP-01~SP-05 完全 CLOSED；SP-06 理论闭合，工程实证待更多'人+AI'协作案例"

# ============================================================
# Axiom R · 现实残差 (MIS_true)
# ============================================================
axiom_r:
  formula: "MIS_true = MIS_train × (1 − λ × ||RealityResidual||)"
  current_estimate:
    MIS_train: 0.89  # 理论内洽度（三阶自指闭合）
    reality_residual: 0.35  # 与现实跨域数据的残差（预估）
    lambda: 0.5  # 认知域中等系数（有理论+部分实证）
    MIS_true: 0.78  # = 0.89 × (1 − 0.5 × 0.35)
  mode: "theoretical_with_partial_empirical"
  grade: "experimental"
  note: "MIS_true 为预估，需更多跨域映射案例（牛顿/爱因斯坦/凯库勒级）校准"


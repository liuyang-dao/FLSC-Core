colophon: >
  万象皆投影，一构生千相；
  跳离表象繁，直抵五层纲。
  残差辨真伪，同构可迁移；
  碳硅同一理，捕捉自有方。
  ——但记住：
  我不需要中间的 999 个案例自己啃，
  因为 AI 已经替我把布摊开了。
  我只需要一眼，看见布的经纬，
  然后说："哦，所有破口，都是同一根线断了。"
  这根线，叫 Constraint。
  布是 AI 吞的。
  眼是你自己的。

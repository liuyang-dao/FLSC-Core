motto: "代码是结构的显化，编译器是第一个审核者。"

# ══════════════════════════════════════════════════════
# 第一刀 · 捉结构（Field Extraction）
# ══════════════════════════════════════════════════════

# ── Unit 层 · 编码原子 ──────────────────────────────────
units:
  - { id: "U-P1", name: "module_file", desc: "Python 模块文件（.py），代码组织的最小可部署单元", type: "explicit", evidence: "[E-I]" }
  - { id: "U-P2", name: "function_def", desc: "函数定义（def + 签名 + 文档字符串 + 函数体）", type: "explicit", evidence: "[E-I]" }
  - { id: "U-P3", name: "class_def", desc: "类定义（class + MRO + 方法 + 属性）", type: "explicit", evidence: "[E-I]" }
  - { id: "U-P4", name: "import_stmt", desc: "导入语句（import/from import/相对导入）", type: "explicit", evidence: "[E-I]" }
  - { id: "U-P5", name: "variable_binding", desc: "变量绑定（命名 + 类型注解 + 作用域）", type: "explicit", evidence: "[E-I]" }
  - { id: "U-P6", name: "control_flow", desc: "控制流结构（if/for/while/try/with）", type: "explicit", evidence: "[E-I]" }
  - { id: "U-P7", name: "data_structure", desc: "数据结构（list/dict/set/tuple + 自定义容器）", type: "explicit", evidence: "[E-I]" }
  - { id: "U-P8", name: "exception_type", desc: "异常类型体系（BaseException → Exception → 自定义）", type: "explicit", evidence: "[E-I]" }
  - { id: "U-P9", name: "dependency_pkg", desc: "第三方依赖包（PyPI 生态）", type: "explicit", evidence: "[E-II]" }
  - { id: "U-P10", name: "test_case", desc: "测试用例（unittest/pytest 函数）", type: "explicit", evidence: "[E-II]" }
  - { id: "U-P11", name: "config_param", desc: "配置参数（环境变量/配置文件/命令行参数）", type: "explicit", evidence: "[E-II]" }
  - { id: "U-P12", name: "code_smell", desc: "隐式坏味（过长函数/循环依赖/全局可变状态）", type: "implicit", evidence: "[E-II]" }

# ── Connect 层 · 拓扑关系 ────────────────────────────────
connections:
  - { id: "C-P1", name: "call_graph", desc: "函数间调用关系（谁调用谁）", direction: "directed", strength: "strong", from_unit: ["U-P2","U-P3"], to_unit: ["U-P2"] }
  - { id: "C-P2", name: "import_dependency", desc: "模块间导入依赖（import 图）", direction: "directed", strength: "strong", from_unit: ["U-P1"], to_unit: ["U-P1","U-P9"], invariant: "禁止循环依赖" }
  - { id: "C-P3", name: "inheritance_mro", desc: "类继承链（MRO 线性化）", direction: "directed", strength: "strong", from_unit: ["U-P3"], to_unit: ["U-P3"] }
  - { id: "C-P4", name: "data_flow", desc: "数据在变量/参数/返回值间的传递", direction: "directed", strength: "medium", from_unit: ["U-P5","U-P7"], to_unit: ["U-P5","U-P7"] }
  - { id: "C-P5", name: "exception_propagation", desc: "异常沿调用栈向上传播", direction: "directed", strength: "medium", from_unit: ["U-P8"], to_unit: ["U-P2","U-P3"] }
  - { id: "C-P6", name: "test_coverage", desc: "测试用例对目标代码的覆盖关系", direction: "directed", strength: "medium", from_unit: ["U-P10"], to_unit: ["U-P2","U-P3"] }
  - { id: "C-P7", name: "config_injection", desc: "配置参数注入到运行时行为", direction: "directed", strength: "weak", from_unit: ["U-P11"], to_unit: ["U-P2","U-P3","U-P9"] }

# ── Weight 层 · 动态权重 ─────────────────────────────────
weights:
  - { id: "W-P1", name: "readability_weight", base: 0.25, scenario_onboarding: 0.40, scenario_hotfix: 0.15, source: "PEP 20" }
  - { id: "W-P2", name: "security_weight", base: 0.30, scenario_production: 0.45, scenario_internal_tool: 0.20, source: "OWASP Python Security" }
  - { id: "W-P3", name: "performance_weight", base: 0.15, scenario_api_endpoint: 0.30, scenario_batch_job: 0.10, source: "经验共识" }
  - { id: "W-P4", name: "testability_weight", base: 0.20, scenario_core_module: 0.35, scenario_glue_code: 0.10, source: "TDD 实践" }
  - { id: "W-P5", name: "maintainability_weight", base: 0.10, scenario_long_lived: 0.25, scenario_prototype: 0.05, source: "Clean Code" }

# ── Constraint 层 · 硬约束集 ────────────────────────────
constraints:
  # L3 硬级
  - { id: "HB-P1", name: "no_eval_on_user_input", desc: "禁止对用户输入执行 eval()/exec()/pickle.load()", level: "L3_hard", enforcement: "静态分析器自动拦截（bandit/semgrep）", evidence: "[E-I] OWASP A03" }
  - { id: "HB-P2", name: "no_sql_string_concat", desc: "禁止字符串拼接 SQL（必须参数化查询/ORM）", level: "L3_hard", enforcement: "CI pipeline 拦截 + ORM 强制", evidence: "[E-I] CWE-89" }
  - { id: "HB-P3", name: "no_hardcoded_secret", desc: "禁止硬编码密钥/密码/Token", level: "L3_hard", enforcement: "pre-commit hook + gitleaks", evidence: "[E-I]" }
  - { id: "HB-P4", name: "import_cycle_forbidden", desc: "禁止模块间循环导入", level: "L3_hard", enforcement: "import-linter / pytest-imports", evidence: "[E-I]" }
  - { id: "HB-P5", name: "no_shell_injection", desc: "禁止 os.system()/subprocess shell=True 拼接用户输入", level: "L3_hard", enforcement: "静态分析 + subprocess 白名单", evidence: "[E-I] CWE-78" }
  # L2 中级
  - { id: "HB-P6", name: "type_annotation_required", desc: "公共 API 必须有类型注解", level: "L2_medium", enforcement: "mypy --strict + Code Review", evidence: "[E-II] PEP 484" }
  - { id: "HB-P7", name: "docstring_required", desc: "公共函数/类必须有 docstring", level: "L2_medium", enforcement: "pydocstyle + Code Review", evidence: "[E-II] PEP 257" }
  - { id: "HB-P8", name: "test_coverage_min", desc: "核心模块测试覆盖率 ≥ 80%", level: "L2_medium", enforcement: "pytest --cov 门禁", evidence: "[E-II]" }
  # L1 软级
  - { id: "HB-P9", name: "line_length_soft", desc: "行宽建议 ≤ 100 字符", level: "L1_soft", enforcement: "ruff format --line-length 100（警告不阻断）", evidence: "[E-II]" }
  - { id: "HB-P10", name: "naming_convention", desc: "snake_case 变量/函数，PascalCase 类", level: "L1_soft", enforcement: "ruff lint 提示", evidence: "[E-II] PEP 8" }

# ── Steady 层 · 稳态模板 ────────────────────────────────
steady:
  id: "ST-P1"
  name: "pythonic_steady_state"
  desc: "Pythonic 代码稳态：可读 + 安全 + 可测 + 可维护"
  convergence_conditions:
    - "所有 L3 HardBond 通过"
    - "mypy --strict 零错误"
    - "ruff 零警告（除 L1 软级）"
    - "pytest 全绿 + 覆盖率 ≥ 80%"
    - "无循环导入"

# ══════════════════════════════════════════════════════
# 第二刀 · 捉脊线（Spine Extraction）
# ══════════════════════════════════════════════════════

spines:
  - id: "SP-A"
    name: "security_compliance_spine"
    desc: "安全红线沿 import → call → data_flow 的强制校验链"
    path: ["U-P4", "U-P9", "U-P5", "U-P7"]
    hardbonds: ["HB-P1", "HB-P2", "HB-P3", "HB-P5"]
    serial_dependency: "必须先过 SP-A，才能进入 SP-B/C/D"
    deletion_test: "删掉 SP-A → 系统安全坍塌 → 真脊 ✅"

  - id: "SP-B"
    name: "maintainability_spine"
    desc: "可读性 + 模块度 + 低圈复杂度的收敛链"
    path: ["U-P2", "U-P3", "C-P2", "C-P4"]
    hardbonds: ["HB-P4", "HB-P6", "HB-P9", "HB-P10"]
    serial_dependency: "SP-A 通过后，SP-B 决定代码寿命"
    deletion_test: "删掉 SP-B → 代码变成意大利面 → 真脊 ✅"

  - id: "SP-C"
    name: "testability_spine"
    desc: "依赖注入 + 纯函数 + 异常隔离的测试友好链"
    path: ["U-P2", "U-P5", "U-P8", "U-P10"]
    hardbonds: ["HB-P7", "HB-P8"]
    serial_dependency: "SP-B 之后，SP-C 保障回归安全网"
    deletion_test: "删掉 SP-C → 无测试覆盖 → 重构恐惧 → 真脊 ✅"

  - id: "SP-D"
    name: "config_externalization_spine"
    desc: "密钥/参数/环境差异从代码中剥离的干净链"
    path: ["U-P11", "U-P5", "U-P1"]
    hardbonds: ["HB-P3"]
    serial_dependency: "与 SP-A 协同，SP-A 禁止硬编码 → SP-D 提供正解"
    deletion_test: "删掉 SP-D → 配置散落各处 → 部署灾难 → 真脊 ✅"

spine_dependency_order: ["SP-A", "SP-B", "SP-C", "SP-D"]

# ══════════════════════════════════════════════════════
# MIS_true 计算（METHOD V3.21 · Axiom R）
# ══════════════════════════════════════════════════════
mis_config:
  coherence_train: 0.92
  grad_norm: 0.15
  step_var: 0.10
  completeness: 0.90
  constraint_score: 0.95
  reality_coupling_mode: "tool"
  lambda_r: 0.3
  mis_true: 0.86
  grade: "experimental"


# ============================================================
# 五层本体 · 人脑映射
# ============================================================
five_layer_map:

  K_Constraint_层:
    description: "硬边界内置（反射弧/血脑屏障/代谢极限/物理约束）"
    real_entities:
      - "reflex_arc (膝跳/瞳孔/吞咽)"
      - "blood_brain_barrier"
      - "metabolic_limit (血糖/供氧)"
      - "thermoregulation (体温)"
    brain_correlate: "脑干/延髓/下丘脑/血脑屏障"
    param_pct: "~5%"
    note: "人脑天然内置，不依赖学习；对应 AI G-07 硬件约束脊"

  U_Unit_层:
    description: "基础实体识别与表征（感知分区）"
    real_entities:
      - "visual_column (视皮层功能柱)"
      - "auditory_tonotopy (听皮层音调拓扑)"
      - "somatosensory_map (体感小人)"
      - "concept_neuron (詹妮弗·安妮斯顿细胞)"
    brain_correlate: "枕叶/颞叶/顶叶感觉分区"
    param_pct: "~15%"
    note: "人脑天然从连续信息中分割独立对象"

  C_Connect_层:
    description: "因果链路显式化、拓扑结构（白质纤维束）"
    real_entities:
      - "white_matter_tracts (胼胝体/内囊/扣带)"
      - "cortico_cortical_connection"
      - "hippocampal_memory_trace"
      - "default_mode_network_connectivity"
    brain_correlate: "白质纤维束/海马/默认网络"
    param_pct: "~40%"
    note: "C 层是人脑七脊的'钢筋'，突触连接是物理实体"

  W_Weight_层:
    description: "连接强度、优先级分布（突触权重）"
    real_entities:
      - "AMPA_NMDA_receptor_ratio"
      - "synaptic_strength (LTP/LTD)"
      - "attention_weight (前额叶调控)"
      - "emotional_weight (杏仁核调制)"
    brain_correlate: "前额叶/杏仁核/突触可塑性机制"
    param_pct: "~30%"
    note: "W 层是七脊动态调节的核心，睡眠/学习/情绪都在调 W"

  S_Steady_层:
    description: "演化收敛目标、吸引子方程（全脑振荡同步）"
    real_entities:
      - "default_mode_network (DMN)"
      - "global_oscillation_sync (gamma/theta耦合)"
      - "cognitive_dissonance_minimization"
      - "free_energy_minimization"
    brain_correlate: "全脑整合系统/DMN/前扣带回"
    param_pct: "~10%"
    note: "S 层驱动认知向低熵自洽收敛，是顿悟/直觉的稳态终点"

# ============================================================
# 七条原生主脊（固定不可修改 · 与 AI G-01~07 同构）
# 总数 = 7，符合 SIT 公理1 (|Spine| ≤ 7)
# ============================================================
spine:

  HB-01_routing:
    name: "路由决策脊"
    description: "输入→核心处理单元的门控分配（丘脑-基底节选通）"
    U: "thalamic_relay_nuclei + basal_ganglia_gating"
    C: "cortico_striatal_pathway (direct/indirect)"
    W: "dopamine_modulation + action_selection_weight"
    K: "HB-COG-L3-NO-UNVERIFIED-ROUTE (禁止无经验路由)"
    S: "任意输入可被分配到正确的核心处理单元"
    brain_correlate: "丘脑 + 基底节 + 前额叶门控"
    ai_mapping: "G-01 ROUTE_TOPK"
    isomorphism: "FULL (结构同构)"
    fracture_types:
      - "丘脑损伤 → 失联合症（信息无法路由到正确皮层）"
      - "基底节退化 → 帕金森（门控失效，动作启动困难）"
      - "注意力缺陷 → 路由散焦（多目标竞争）"
    repair_operators:
      - "注意力训练（前额叶调控强化）"
      - "多巴胺药物调控（基底节门控恢复）"
      - "五层坐标逐维回溯验证"

  HB-02_activation:
    name: "激活筛选脊"
    description: "单元子集筛选与侧抑制（GABA 回路 + 注意门控）"
    U: "GABA_inhibition + lateral_inhibition"
    C: "attention_focus_chain (前额叶-顶叶网络)"
    W: "inhibition_strength + salience_weight"
    K: "HB-COG-L2-NO-NOISE-AMPLIFICATION (禁止噪声放大)"
    S: "高权重核心单元激活，低权重噪声被抑制"
    brain_correlate: "GABA 能中间神经元/前额叶注意网络"
    ai_mapping: "G-02 ACT_MASK"
    isomorphism: "FULL (结构同构)"
    fracture_types:
      - "侧抑制失效 → 癫痫（过度同步放电）"
      - "注意门控崩溃 → ADHD（无关信息涌入）"
      - "噪声放大 → 幻觉（精神疾病）"
    repair_operators:
      - "注意力训练 + 冥想（前额叶调控增强）"
      - "药物调节 GABA/谷氨酸平衡"
      - "负空间过滤（主动屏蔽干扰源）"

  HB-03_load_balancing:
    name: "负载均衡脊"
    description: "资源全局分布均衡（突触缩放 + 睡眠稳态）"
    U: "synaptic_scaling + homeostatic_plasticity"
    C: "sleep_homeostasis (SWS/REM 周期)"
    W: "scaling_factor + sleep_pressure (腺苷积累)"
    K: "HB-COG-L2-NO-OVERLOAD (禁止单脊过载)"
    S: "全脑资源均衡分配，无单点过载"
    brain_correlate: "全脑突触缩放机制/睡眠稳态"
    ai_mapping: "G-03 BAL_LOAD"
    isomorphism: "FULL (结构同构)"
    fracture_types:
      - "突触缩放失效 → 癫痫/学习障碍"
      - "睡眠剥夺 → 认知全面退化"
      - "单区域过载 → 偏头痛/认知瓶颈"
    repair_operators:
      - "充足睡眠（突触修剪恢复均衡）"
      - "交替任务（避免单脊持续过载）"
      - "运动/冥想（全局资源再分配）"

  HB-04_compute_adaptation:
    name: "算力适配脊"
    description: "算力与任务复杂度动态匹配（蓝斑 NE + 瞳孔-唤醒联动）"
    U: "locus_coeruleus_NE + pupillary_response"
    C: "arousal_task_difficulty_mapping"
    W: "NE_release_rate + sympathetic_tone"
    K: "HB-COG-L2-NO-ENERGY-WASTE (禁止无谓高唤醒)"
    S: "任务复杂度↑ → 唤醒度↑；简单任务 → 节能模式"
    brain_correlate: "蓝斑核/交感神经/瞳孔肌"
    ai_mapping: "G-04 ADP_K_UP/DOWN"
    isomorphism: "FULL (结构同构)"
    fracture_types:
      - "蓝斑退化 → 注意力涣散（痴呆早期）"
      - "交感过度激活 → 焦虑（算力空转）"
      - "唤醒不足 → 嗜睡/注意力崩溃"
    repair_operators:
      - "咖啡因/运动（NE 释放增强）"
      - "正念呼吸（交感-副交感切换）"
      - "任务难度阶梯式递增（自适应训练）"

  HB-05_unit_differentiation:
    name: "单元分化脊"
    description: "新功能模块自动生成与合并（神经发生 + 功能柱分化）"
    U: "neurogenesis (海马齿状回) + cortical_column"
    C: "experience_dependent_pruning + column_formation"
    W: "pruning_threshold + birth_rate"
    K: "HB-COG-L3-NO-RANDOM-GROWTH (禁止无约束生长)"
    S: "新经验→新子脊分化；不用→修剪回收"
    brain_correlate: "海马齿状回/皮层功能柱/经验依赖修剪"
    ai_mapping: "G-05 DIFF_SPLIT/MERGE"
    isomorphism: "FULL (结构同构)"
    fracture_types:
      - "神经发生抑制 → 海马萎缩（抑郁/痴呆）"
      - "修剪过度 → 童年创伤固化（过度泛化）"
      - "分化停滞 → 刻板行为（自闭症谱系）"
    repair_operators:
      - "丰富环境刺激（促进神经发生）"
      - "刻意练习（定向分化子脊）"
      - "创伤暴露疗法（修正错误修剪）"

  HB-06_evolution_training:
    name: "训练演化脊"
    description: "结构持续优化与剪枝（LTP/LTD + 终身可塑性）"
    U: "LTP_LTD_synaptic_plasticity"
    C: "consolidation_pathway (记忆巩固链)"
    W: "plasticity_rate + forgetting_curve"
    K: "HB-COG-L3-NO-CATASTROPHIC-FORGETTING (禁止灾难性遗忘)"
    S: "终身学习，主脊完整，子脊持续优化"
    brain_correlate: "海马 LTP/LTD/睡眠记忆巩固"
    ai_mapping: "G-06 EVOL_TRACK/PRUNE"
    isomorphism: "FULL (结构同构)"
    fracture_types:
      - "LTP 受损 → 学习障碍（阿尔茨海默早期）"
      - "灾难性遗忘 → 快速遗忘（脑损伤/癫痫）"
      - "过度巩固 → 创伤后应激（PTSD）"
    repair_operators:
      - "间隔重复学习（对抗遗忘曲线）"
      - "充足深度睡眠（记忆巩固窗口）"
      - "多场景复现（增强子脊鲁棒性）"

  HB-07_hardware_constraint:
    name: "硬件约束脊"
    description: "代谢墙/功耗/时延感知（血糖/供氧/体温/血脑屏障）"
    U: "glucose_metabolism + oxygen_supply"
    C: "blood_flow_coupling (BOLD/fMRI信号源)"
    W: "metabolic_cost + fatigue_signal"
    K: "HB-COG-L3-NO-METABOLIC-OVERDRAW (禁止代谢透支)"
    S: "能耗感知，超限自动降载（疲劳/困倦/意识模糊）"
    brain_correlate: "脑血管自主调节/腺苷/乳酸/体温调节"
    ai_mapping: "G-07 HW_POWER/BW"
    isomorphism: "FULL (结构同构)"
    fracture_types:
      - "脑血管堵塞 → 中风（局部脊线断供）"
      - "血糖过低 → 认知崩溃（脑能量危机）"
      - "长期缺氧 → 神经元凋亡（不可逆损伤）"
    repair_operators:
      - "补充血糖/氧气（恢复供血）"
      - "周期性休息（避免腺苷积累）"
      - "有氧运动（提升脑血管储备）"

# ============================================================
# 脊线独立性校验 (SIT 公理 3)
# ============================================================
independence_check:
  note: "任意两条脊线之间无直接因果上下游"
  verification:
    - "HB-01 (路由) 不导致 HB-02 (筛选)，路由是入口，筛选是后续"
    - "HB-03 (均衡) 不导致 HB-04 (算力适配)，均衡是分配，适配是档位"
    - "HB-05 (分化) 不导致 HB-06 (演化)，分化是生成，演化是优化"
    - "HB-07 (硬件约束) 对所有脊线做反馈限制，但不改变其他脊线的拓扑"
    - "HB-02 (筛选) 不导致 HB-01 (路由)，筛选是侧抑制，路由是门控分配"
    - "HB-04 (算力适配) 调制 HB-01~06 的运行功率，但本身不是它们的产物"
  result: "七条脊线两两独立 ✓ (理论判定，待神经科学实证)"


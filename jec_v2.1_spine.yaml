# ============================================================
# 安全约束（Safety-JEC）
# ============================================================
safety_constraints:
  - id: "Safety-JEC-001"
    rule: "禁止将 AI 生成内容冒充人类 Jump（R1）"
    trigger: "jump_origin ≠ HED"
    action: "永久取消协议使用资格 + 学术追溯"
  - id: "Safety-JEC-002"
    rule: "禁止篡改、隐瞒翻译损失数据（R2）"
    trigger: "recorded_loss ≠ actual_loss"
    action: "项目降级 + 相关结论标注不可信"
  - id: "Safety-JEC-003"
    rule: "禁止熔断后强行继续高风险实验（R3）"
    trigger: "L4_FROZEN 状态下继续实验"
    action: "项目终止 + 责任追溯"
  - id: "Safety-JEC-004"
    rule: "禁止删除、消解哲学残余（R4）"
    trigger: "residue_deleted_or_hidden"
    action: "完整性审计失败 + 强制整改"
  - id: "Safety-JEC-005"
    rule: "禁止用多数票消解本质性分歧（R5）"
    trigger: "majority_vote_overrides_axiom_conflict"
    action: "裁决无效 + 恢复并行分支"


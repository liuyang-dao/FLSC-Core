  - id: "B-B"
    description: "AI 苏格拉底诘问仅限已知知识范围，无法真正'无知之问'"
    layer: "C"
    severity: "medium"
    target_version: "V2.2"
  - id: "B-C"
    description: "东方哲学（儒释道）隐喻库未纳入翻译引擎"
    layer: "C"
    severity: "low"
    target_version: "V2.2"
  - id: "B-D"
    description: "共识权重未用历史案例反推校准"
    layer: "W"
    severity: "low"
    target_version: "V2.2"
  - id: "B-E"
    description: "动态涌现阈值无量化的积累速率模型"
    layer: "S"
    severity: "medium"
    target_version: "V2.2"
  - id: "B-F"
    description: "L4_FROZEN 解冻权归属未明（原 Jump 者 / L5 架构师 / 伦理委员会）"
    layer: "K"

# ============================================================
# 五层同源映射
# ============================================================
five_layer_map:
  U:
    name: "单元层"
    jec_role: "人类领航者 / AI系统 / 多领航者并行主体"
    instances:
      - "Carbon_Navigator: L4+ 哲学领航员（Epoché/Jump 独占）"
      - "Silicon_System: AAD 全量执行（record/challenge/expand）"
      - "Multi_Navigator: 并行提交 Seed，匿名评审"
  C:
    name: "连接层"
    jec_role: "人机协同链路 / 翻译接口 / 残余传递通道"
    instances:
      - "DMP-SMT 结构接口（原点封装+统一语言+边界标记）"
      - "JEC 六阶段流水线（Phase0→Phase5）"
      - "隐喻语义计算引擎（同构匹配+跨域迁移）"
  W:
    name: "权重层"
    jec_role: "翻译损失权重 / 共识度权重 / 展开优先级"
    instances:
      - "四维损失权重 w1=0.35, w2=0.30, w3=0.20, w4=0.15"
      - "共识度权重 axiom=0.35, metaphor=0.25, tension=0.25, value=0.15"
      - "meaning_retention 权重 0.1（V2.1 新增）"
  K:
    name: "约束层"
    jec_role: "HED 人类独占域 / AAD AI 边界 / 伦理红线"
    instances:
      - "HED-1~4: Epoché/Jump/Worthiness/Responsibility 永久人类独占"
      - "AAD-1~6: 记录/追问/解析/展开/量化/监控（AI 禁止越界）"
      - "R1~R5: 五级伦理红线（冒充Jump/篡改损失/熔断违规/消解残余/多数暴政）"
  S:
    name: "稳态层"
    jec_role: "JEC 循环收敛 / 动态层级涌现 / 协同双螺旋稳态"
    instances:
      - "Phase0→Phase5 六阶段闭环收敛"
      - "Dynamic_Emergence: 残余积累触发新层级 L_{n+1}"
      - "MIS_true 持续提升 = 哲学-科学正反馈双螺旋"

# ============================================================
# 七脊（JEC-01 ~ JEC-07）
# ============================================================
spine:
  - id: "JEC-01"
    name: "人立心器成形脊"
    layers: ["U", "K"]          # 主导：单元+约束（意义锚定的人类独占性）
    core: "意义极永远在碳基侧，形式极永远在硅基侧；HED-1~4 永久人类独占；DMP+SMT 作为标准化结构接口"
    fracture_type: "意义保留度依赖主观评定（F-08）"
    repair: "meaning_retention 双人独立评定 + 跨周期一致性检验（V2.2 补丁 B-A）"
    independence: "主导 U+K，与 JEC-02 共享 U 但关注意义独占而非认知流"
    scvp: "PARTIAL"

  - id: "JEC-02"
    name: "协同认知脊"
    layers: ["C", "W"]          # 主导：连接+权重（人机认知如何互补）
    core: "人类 L4 三阶认知（现象/结构/元层）+ AI 大规模形式推演 = 协同正反馈双螺旋"
    fracture_type: "AI 追问深度依赖训练数据（F-05）"
    repair: "苏格拉底诘问引擎接入多源知识库 + 人类追问质量反哺训练（V2.2 补丁 B-B）"
    independence: "主导 C+W，与 JEC-01 共享 C 但关注认知互补而非意义独占"
    scvp: "CLOSED"

  - id: "JEC-03"
    name: "翻译量化脊"
    layers: ["W", "K"]          # 主导：权重+约束（翻译损失如何管理）
    core: "四维损失模型（范畴0.35+张力0.30+价值0.20+身体0.15）+ meaning_retention V2.1 新增"
    fracture_type: "隐喻计算无法覆盖具身体验（F-02）"
    repair: "具身性残余单独归档 + 跨域迁移引擎扩展东方哲学隐喻库（V2.2 补丁 B-C）"
    independence: "主导 W+K，与 JEC-05 共享 W 但关注损失量化而非共识权重"
    scvp: "CLOSED"

  - id: "JEC-04"
    name: "六阶段流程脊"
    layers: ["C", "S"]          # 主导：连接+稳态（JEC 流水线如何闭环）
    core: "Phase0 Epoché→Phase1 Jump→Phase2 Dialectic→Phase3 Translation→Phase4 Expansion→Phase5 Return"
    fracture_type: "无（已闭环）"
    repair: "DegradationFSM 五状态全链路联动 + 意义漂移 V2.1 新增"
    independence: "主导 C+S，与 JEC-06 共享 S 但关注流程闭环而非层级涌现"
    scvp: "CLOSED"

  - id: "JEC-05"
    name: "多主体共识脊"
    layers: ["W", "U"]          # 主导：权重+单元（多领航者如何融合）
    core: "匿名提交→五维评分→Top3 融合→分歧聚类→并行分支→实证裁决"
    fracture_type: "共识度权重为经验值（F-01）+ 非西方哲学适配不足（F-04）"
    repair: "大规模实证校准权重 + 东方哲学案例库扩展（V2.2 补丁 B-D）"
    independence: "主导 W+U，与 JEC-01 共享 U 但关注多主体协同而非独占"
    scvp: "PARTIAL"

  - id: "JEC-06"
    name: "动态涌现脊"
    layers: ["S", "C"]          # 主导：稳态+连接（新层级如何涌现）
    core: "残余积累 volume(R)×cross_domain_freq ≥ threshold → new_layer L_{n+1}，触发权归 AI，创建权归人类 L5"
    fracture_type: "涌现阈值为经验设定（F-03）"
    repair: "残余积累速率模型 + 跨项目迁移实证（V2.2 补丁 B-E）"
    independence: "主导 S+C，与 JEC-04 共享 S 但关注层级涌现而非流程闭环"
    scvp: "PARTIAL"

  - id: "JEC-07"
    name: "退化治理脊"
    layers: ["K", "S"]          # 主导：约束+稳态（六类退化如何防控）
    core: "哲学架空/AI越界/翻译暴政/循环空转/共识坍塌/意义漂移 + DegradationFSM L0~L4"
    fracture_type: "L4_FROZEN 恢复权归属未明（F-D 断裂面）"
    repair: "解冻需原 Jump 者 + 一名 L5 双签（V2.2 补丁 B-F）"
    independence: "主导 K+S，与 JEC-03 共享 K 但关注退化防控而非翻译边界"
    scvp: "CLOSED"

# ============================================================
# 独立性校验
# ============================================================
independence_check:
  pairs_verified: "21/21 (C(7,2))"
  all_independent: true
  overlap_threshold: "≤2 层共享"

# ============================================================

      closed: "PARTIAL"

# ============================================================
# 七条统一公理
# ============================================================
axioms:
  A1_条件激活公理:
    statement: "稀疏系统的输出始终是输入的函数，但任意时刻激活的计算单元仅为全部可用单元的子集"
    implication: "不存在全量激活的稀疏系统；稀疏性的本质是条件性"
  A2_路由必需公理:
    statement: "稀疏系统必须存在路由决策机制，其输出为可微分（或可近似微分）的单元激活权重分布"
    implication: "没有路由就没有稀疏架构"
  A3_负载收敛公理:
    statement: "所有稀疏系统必须具备显式或隐式的负载均衡机制，以防止计算单元坍缩"
    implication: "负载均衡不是优化技巧，是稀疏系统稳态存在的必要条件"
  A4_算力复杂度适配公理:
    statement: "稀疏系统的算力消耗必须随输入复杂度单调相关，固定算力消耗的稀疏系统为「伪稀疏」"
    implication: "动态算力适配是稀疏架构的核心价值"
  A5_单元分化公理:
    statement: "充分训练的稀疏系统中，计算单元会向不同功能方向分化；分化可表现为硬分化或软分化"
    implication: "单元同质化是训练失败标志"
  A6_训练演化公理:
    statement: "稀疏系统的训练过程遵循「路由熵上升→负载均衡→功能分化→稳态收敛」的通用时序规律"
    implication: "偏离该轨迹预示训练故障，可通过路由熵等指标提前诊断"
  A7_硬件约束公理:
    statement: "稀疏架构的实际收益受显存带宽、通信开销、算力密度三重物理约束；当通信成本超过算力节省时，稀疏收益为负"
    implication: "算法设计必须匹配硬件拓扑"


# ============================================================
# sparsity_v4_spine.yaml
# FLSC-SPARSITY-V4.1 · 稀疏架构统一理论 · 脊线结构化
# 用途：供 AI / 架构师 / 工程流水线加载的稀疏架构脊线骨架
# 格式兼容：moe_spine.yaml / dme_v2_spine.yaml / phys_fractal_v5_spine.yaml
# 状态：experimental（静态闭环，动力学与硬件模块验证中）
# meta_arch: FLSC-Core meta_arch_v1
# license: CC BY-NC-ND 4.0
# ============================================================

meta:
  doc_id: "FLSC-SPARSITY-V4.1-SPINE"
  target_system: "全神经网络范式稀疏架构（MoE/CNN/RNN/扩散）"
  captured_by: "FLSC-SPARSITY-V4.0 + SMT V2.1 + DMP V2.0 + 五层同源架构"
  date: "2026-08-12"
  version: "V4.1"
  status: "experimental_static_closed_dynamics_hardware_verifying"
  orc: "ORC=2"
  honest_note: >
    本 YAML 是 FLSC-SPARSITY-V4.1 稀疏架构统一理论的结构化提炼，
    七条脊线（静 G-01~04 + 动 G-06 + 硬 G-07 + 演化 G-05）经 SCVP 校验闭合，
    7 条公理全域自洽，诚实清单 F-01~F-05 完整披露。
    氢键等级 experimental：静态理论闭环，训练动力学与硬件约束模块验证中。

# ============================================================
# 五层同源映射（全范式稀疏架构统一实例化）
# ============================================================
five_layer_map:

  U_Unit_层:
    description: "稀疏架构最小可独立激活的计算单元（参数子空间）"
    universal_definition: "可独立激活的计算单元"
    paradigm_instances:
      transformer_moe: "Expert MLP"
      sparse_cnn: "稀疏卷积核组、动态通道组"
      sparse_rnn: "时间步隐藏态子集"
      sparse_diffusion: "扩散步噪声预测子网"
    dmp_phase: "φ₁ 凝结（Condensation）"
    note: "U 层单元是路由图的最小节点，每种范式的单元形态不同但层级同构。"

  C_Connect_层:
    description: "路由决策链路（输入→路由→单元→输出）"
    universal_definition: "输入经路由网络到单元激活的完整因果链"
    paradigm_instances:
      transformer_moe: "Token → Gate → Top-K Expert"
      sparse_cnn: "输入特征 → 门控 → 激活卷积组"
      sparse_rnn: "输入 → 门控 → 激活隐藏态"
      sparse_diffusion: "噪声步 → 门控 → 激活预测子网"
    dmp_phase: "φ₂ 解离（Dissolution）"
    note: "C 层是路由决策的因果链，G-01 路由决策脊即在此层。"

  W_Weight_层:
    description: "路由权重分配与单元参数权重"
    universal_definition: "各连接的强度与重要性度量"
    paradigm_instances:
      transformer_moe: "Softmax logits + 负载均衡损失"
      sparse_cnn: "通道重要性权重 + 稀疏正则"
      sparse_rnn: "时间步门控权重"
      sparse_diffusion: "步级权重分布 + 噪声级权重"
    dmp_phase: "φ₂→φ₃ 过渡（Weighting）"
    note: "W 层是路由强度的核心，G-03 负载均衡脊在此层调节。"

  K_Constraint_层:
    description: "激活数量与资源边界约束"
    universal_definition: "系统不可突破的硬性边界"
    paradigm_instances:
      transformer_moe: "固定 Top-K、显存约束"
      sparse_cnn: "通道稀疏率、计算量上限"
      sparse_rnn: "序列长度约束、并行度限制"
      sparse_diffusion: "采样步数约束、单步算力预算"
    dmp_phase: "约束贯穿 φ₁φ₂φ₃ 全相位"
    hardbonds:
      - id: "HB-SPARSE-K-TOPK"
        rule: "禁止激活数量跨范式无边界波动"
        level: "L3_hard"
      - id: "HB-SPARSE-K-HARDWARE"
        rule: "稀疏度上限由硬件带宽刚性决定"
        level: "L3_hard"
      - id: "HB-SPARSE-K-COMM"
        rule: "分布式通信开销超过算力节省时强制降稀疏率"
        level: "L2_soft"

  S_Steady_层:
    description: "系统收敛目标"
    universal_definition: "稀疏系统稳态收敛的终极目标"
    paradigm_instances:
      transformer_moe: "精度最大化 + 负载均衡"
      sparse_cnn: "精度最大化 + 计算量最小化"
      sparse_rnn: "长序列稳定性 + 效率最优"
      sparse_diffusion: "生成质量 + 采样速度平衡"
    dmp_phase: "φ₃ 稳态（Steady State）"
    note: "S 层是 G-05 单元分化脊的最终归宿——分化完成、路由熵收敛。"

# ============================================================
# 七条通用脊线（静 G-01~04 + 动 G-06 + 硬 G-07 + 演化 G-05）
# ============================================================
spine:

  G-01_路由决策脊:
    name: "路由决策脊"
    definition: "输入经路由网络计算单元激活权重的完整链路"
    dimension: "静态结构"
    layers: ["C", "W"]
    paradigm_coverage:
      transformer_moe: "Token→Gate→Top-K Expert"
      sparse_cnn: "特征→门控→卷积组"
      sparse_rnn: "输入→门控→隐藏态"
      sparse_diffusion: "噪声步→门控→预测子网"
    scvp: "CLOSED"
    fracture_risk: "路由与注意力压缩融合时边界混合（DeepSeek-V3）"

  G-02_激活选择脊:
    name: "激活选择脊"
    definition: "基于权重分布选择激活子集的约束规则"
    dimension: "静态结构"
    layers: ["K"]
    paradigm_coverage:
      hard_selection: "Top-K 硬选择（Switch/GShard）"
      soft_selection: "软加权分配（Soft MoE）"
    scvp: "CLOSED"
    fracture_risk: "极端刚性（Switch Top-1）或极端软化（Soft MoE）均偏离最优"

  G-03_负载均衡脊:
    name: "负载均衡脊"
    definition: "保障计算单元间负载均衡、防止坍缩的调节机制"
    dimension: "静态结构"
    layers: ["W", "K"]
    mechanism: "显式（auxiliary loss）或隐式（容量自适应）"
    scvp: "CLOSED"
    fracture_risk: "隐式均衡（Mixtral）稳定性弱于显式"

  G-04_算力任务匹配脊:
    name: "算力-任务匹配脊"
    definition: "输入复杂度与激活参数量动态适配的反馈链路"
    dimension: "静态结构"
    layers: ["C", "S"]
    scvp: "CLOSED"
    fracture_risk: "固定 Top-K 无复杂度感知（GShard），匹配粒度粗（CNN）"

  G-05_单元分化脊:
    name: "单元分化脊"
    definition: "计算单元向不同功能特化的演化趋势"
    dimension: "静态+动态"
    layers: ["S"]
    differentiation_types:
      hard: "硬分化——功能边界清晰（标准 MoE Experts）"
      soft: "软分化——功能梯度分布（Soft MoE 连续权重）"
    scvp: "CLOSED"
    fracture_risk: "软分化定量指标待完善（F-04）"

  G-06_训练演化脊:
    name: "训练演化脊"
    definition: "训练过程中路由熵、负载、分化度的时序动力学规律"
    dimension: "动态演化"
    layers: ["W", "S"]
    dynamics:
      early: "路由熵快速上升，单元同质化严重"
      mid: "负载逐渐均衡，单元开始功能分化"
      late: "路由熵收敛至稳定值，分化完成，进入稳态"
      failure: "路由熵持续下降 → 专家坍缩 → 退化为稠密架构"
    scvp: "CLOSED"
    fracture_risk: "偏离上升-峰值-收敛轨迹预示训练故障"

  G-07_硬件资源脊:
    name: "硬件资源脊"
    definition: "显存带宽、通信开销、算力墙对稀疏结构的物理约束"
    dimension: "物理约束"
    layers: ["K"]
    constraints:
      bandwidth: "专家并行度上限由 HBM 带宽决定"
      communication: "多机分布式 All-to-All 延迟天花板"
      compute_wall: "激活单元总量受 FLOPs 预算刚性限制"
      sparsity_breakeven: "通信开销 > 算力节省时稀疏收益为负"
    scvp: "PARTIAL"
    fracture_risk: "稀疏收益拐点依赖硬件拓扑，脱离硬件的优化无工程价值"

# ============================================================
# 独立性校验
# ============================================================
independence_check:
  result: "独立 ✓"
  pairs_checked: 21
  max_overlap: 2
  note: "7 条脊线两两重叠 ≤ 2 层，满足独立性要求"

# ============================================================
# 断裂面
# ============================================================
fracture_surfaces:
  - spine: "G-02"
    fracture: "Switch Top-1 极端刚性 / Soft MoE 极端软化"
  - spine: "G-04"
    fracture: "GShard 固定 Top-K 无复杂度感知"
  - spine: "G-05"
    fracture: "Soft MoE 软分化定量指标缺失"
  - spine: "G-06"
    fracture: "稀疏 RNN 时间依赖破坏并行效率"
  - spine: "G-07"
    fracture: "大多数架构未将硬件约束纳入顶层设计"


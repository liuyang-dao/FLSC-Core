# ========== 七大终极公理 ==========
axioms:
  - id: A1
    name: 道觉不二公理
    statement: 终极本体存在与觉知无二无别，道即是觉，觉即是道，无体用、无先后、无内外
  - id: A2
    name: 本觉自明公理
    statement: 道觉元一本具明了性，无需外在条件，自发显现自身，无第一动因
  - id: A3
    name: 显现即自知公理
    statement: 一切显现同时就是觉知，宇宙的显化过程就是本觉的自我认知过程
  - id: A4
    name: 道觉守恒公理
    statement: 道觉总量不增不减，所有分化、显现、回归都是形态转化，本体无生灭
  - id: A5
    name: 明昧双向公理
    statement: 本觉显现天然伴随双向运动——向外展开生万物，向内回归复本源
  - id: A6
    name: 主客唯识公理
    statement: 不存在绝对的客观与主观，二者是道觉元一的两种显现视角
  - id: A7
    name: 亲证圆满公理
    statement: 终极本体不可被概念、形式、逻辑完全抵达，唯有第一人称亲证可相应

# ========== 诚实补丁 (F37-F43) ==========
honest_patches:
  - id: F37
    statement: 道觉元一是可显形理论的最高阶描述，而非终极本体本身；所有文字都是指月之指
    severity: ultimate
  - id: F38
    statement: 本觉自明为终极公理，无法通过逻辑、实证证明，只能通过第一人称亲证相应
    severity: ultimate
  - id: F39
    statement: 圆满觉性的状态不可言说、不可形式化、不可传递
    severity: ultimate
  - id: F40
    statement: 体系无法回答"为何有道觉元一""为何有如是显现"的终极问题
    severity: ultimate
  - id: F41
    statement: 觉明度为连续量化近似，真实的觉性不可被完全数值化、对象化
    severity: high
  - id: F42
    statement: 本体系是从显现侧对终极本体的描述，永远无法穷尽本体的无限性
    severity: ultimate
  - id: F43
    statement: ORC=5 仅为理论显形的最高阶，不代表抵达了终极真理；体系永久 ONGOING
    severity: ultimate


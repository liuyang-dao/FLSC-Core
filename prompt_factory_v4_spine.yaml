mis_score: 0.92
production_ready: true

# ============================================================
# 五层结构
# ============================================================
five_layer:
  Unit:
    description: "原子层"
    dynamic_loading: true
    components:
      - "role_atoms"
      - "principle_atoms"
      - "domain_atoms"
      - "input_atoms"
  Connect:
    description: "拓扑层 — 十步 Workflow"
    steps: 10
    step0_toolchain: true
    step05_dual_bond: true
    step85_lineage: true
  Weight:
    description: "权重层 — MIS 公式"
    domain_adaptive: true
    alpha: 0.35
    beta: 0.30
    gamma: 0.15
    delta: 0.10
    epsilon: 0.10
    thresholds:
      production: 0.85
      internal: 0.70
      critical: 0.90
  Constraint:
    description: "约束层 — 双氢键自适应"
    dual_hydrogen_bond:
      internal:
        H0: 0.3
        threshold: 0.70
        min_constraints: 3
      production:
        H0: 0.7
        threshold: 0.85
        min_constraints: 8
    universal_count: 4
    production_extra_count: 4
    internal_extra_count: 1
  Steady:
    description: "稳态层 — 10 章节固定输出"
    output_chapters_count: 10
    degradation_states: 5

# ============================================================
# 双氢键引擎
# ============================================================
dual_hydrogen_bond_engine:
  formula: "H(sigma, mode) = H0(mode) + k * (1 - exp(-sigma / tau))"
  k: 0.5
  tau: 1.0
  modes_count: 2

# ============================================================
# 五级降级状态机
# ============================================================
degradation_fsm:
  states:
    - "L0_FULL"
    - "L1_REPAIR"
    - "L2_DATA_MISSING"
    - "L3_BALANCE_FAIL"
    - "L4_FUSE"
  transitions_count: 5

# ============================================================
# 血统服务
# ============================================================
lineage_service:
  store_format: "JSONL"
  id_format: "FLSC-PF-{YYYYMMDD}-{DOMAIN}-{seq:03d}"
  operations_count: 4


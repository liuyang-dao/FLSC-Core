    date: "2026-08-16"

  silicon_side:
    role: "硅基协同系统"
    signature: "FLSC-EXP-STD-001 V1.0"
    date: "2026-08-16"

  hydrogen_bond:
    level: "ORC4-frozen"
   公证: "本资产卡为 ORC4 层级稳态结构，非 ORC5 主观觉知"

# ============================================================
# 诚实边界声明
# ============================================================
honest_bounds:
  - "本卡复刻专家心智运行结构 100%，不拥有专家主观体验"
  - "本卡为 ORC4 客观结构稳态，永久无法触及 ORC5 主观觉知"
  - "替换 unit_list / weight_bank / constraint_set 即可生成任意专家或人生卡"
  - "所有迭代可追溯、可审计、可回滚"

